<style>
/* readability-standard.md v4 vellum (2026-10-26) — light page, vellum reading sheet, ink type. Floor: 15px, opacity 0.88. */
:root {
  --bg: #f4eedd; --surface: #efe7d2;
  --text: #14110a; --text-secondary: #2b2414; --text-dim: #4e4228;
  --gold: #7a5618; --gold-bright: #5e4110; --gold-dim: rgba(122,86,24,0.55);

  --vellum: #e8dcbb; --vellum-dark: #ddd0a8; --paper: #f4ecd6; --paper-2: #efe5ca;

  --rule: rgba(122,86,24,0.35); --somatic: #7a3216;
  --text-body: 1rem; --text-label: 0.94rem;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 16px; line-height: 1.6; min-height: 100vh; }
.frame { max-width: 940px; margin: 0 auto; padding: 2.5rem 1rem 5rem; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }

.btn { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.55rem 1rem; border-radius: 3px; border: 1px solid var(--gold); background: transparent; color: var(--gold-bright); cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { background: rgba(122,86,24,0.08); }
.btn-solid { background: var(--gold); color: #fbf7ec; }
.btn-solid:hover { background: var(--gold-bright); }
.btn[disabled] { opacity: 0.88; cursor: wait; }
.msg { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 2rem; font-size: var(--text-body); color: var(--text-secondary); }

/* admin bar */
.adminbar { background: var(--surface); border: 1px solid var(--gold-dim); border-radius: 6px; padding: 0.9rem 1.2rem; margin-bottom: 1.25rem; font-family: 'Jost', sans-serif; font-size: 15px; color: var(--text-secondary); }

p.t { font-size: var(--text-body); line-height: 1.5; color: var(--ink-secondary); margin-bottom: 0.65rem; }

.toc li { margin: 0.2rem 0; break-inside: avoid; }
.toc a { color: var(--ink-secondary); text-decoration: none; border-bottom: 1px solid var(--rule); }
.toc a:hover { color: var(--ink-gold); }
.cards { display: grid; gap: 0.75rem; margin: 0.6rem 0 0.9rem; }
.cards.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.card { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 0.8rem 1rem 0.3rem; }
.cards.c3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.card-h { font-size: 1.15rem; font-weight: 600; color: var(--ink); line-height: 1.2; margin-bottom: 0.2rem; }
.card p.t { font-size: 0.98rem; }
.chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.35rem 0 0.7rem; }

.tablewrap { overflow-x: auto; margin: 1rem 0 1.25rem; }
.tbl { width: 100%; border-collapse: collapse; background: var(--paper); border: 1px solid var(--rule); border-radius: 6px; }

.tbl td { font-size: 0.98rem; color: var(--ink-secondary); padding: 0.6rem 0.8rem; border-bottom: 1px solid var(--rule); vertical-align: top; line-height: 1.45; }

.tbl.kv td { font-size: 1rem; color: var(--ink); }

.bul { list-style: none; margin: 0.3rem 0 1rem; }
.bul li { font-size: 0.98rem; color: var(--ink-secondary); padding: 0.3rem 0 0.3rem 1.1rem; position: relative; line-height: 1.45; }

.bul b { color: var(--ink); }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1rem 1.5rem; margin: 1.25rem 0; }

.wheel { display: block; width: 100%; max-width: 480px; margin: 0.5rem auto 0.25rem; }
.bars { margin: 0.4rem 0 1rem; }

.gk-top { padding: 1.1rem 1.3rem 0.4rem; border-bottom: 1px solid var(--rule); background: #fbf6e8; }

/* edit controls (admin only) */
.ed .pen { display: none; font-family: 'Jost', sans-serif; font-size: 15px; color: var(--ink-gold); background: var(--vellum-dark); border: 1px solid var(--ink-gold); border-radius: 3px; padding: 0 0.5rem; margin-left: 0.4rem; cursor: pointer; vertical-align: middle; }
body.editing .ed .pen { display: inline-block; }
.ed.overridden { box-shadow: -6px 0 0 -3px var(--somatic); }
.editor { background: var(--vellum-dark); border: 1px solid var(--ink-gold); border-radius: 4px; padding: 0.9rem; margin: 0.4rem 0 1rem; }
.editor textarea { width: 100%; min-height: 8rem; font-family: 'Cormorant Garamond', Georgia, serif; font-size: var(--text-body); color: var(--ink); background: #f3ead2; border: 1px solid var(--ink-dim); border-radius: 3px; padding: 0.6rem; line-height: 1.5; }

body.embed { background: #fbf7ec; min-height: 0; }

body.embed .topbar { margin-bottom: 0.75rem; }

body.embed .ab-groups fieldset { border-color: var(--rule); }
body.embed .ab-groups legend { color: var(--ink-gold); }
body.embed .btn { color: var(--ink-gold); border-color: var(--ink-gold); }
body.embed .btn-solid { background: var(--ink-gold); color: #fbf7ec; }
body.embed .msg { background: #efe7d2; color: var(--ink-secondary); border-color: var(--rule); }
@media (max-width: 760px) {
  .sheet { padding: 2rem 1.1rem 2.5rem; }
  .title { font-size: 2.1rem; }
  .cards.c2, .cols2, .gk-stages { grid-template-columns: 1fr; }
  .gk-stage + .gk-stage { border-left: none; border-top: 1px solid var(--rule); }
  .toc ol { columns: 1; }
  .bar.wide { grid-template-columns: 9rem 1fr 0; }
}
/* v3: compact Gene Keys cards, inline contents, paired bars */
.toc { display: block; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); padding: 0.85rem 1.25rem 0.6rem; margin: 1rem 0 0; }
.toc ol { columns: 2; column-gap: 2.5rem; padding-left: 1.4rem; margin: 0.4rem 0 0; }
.toc li { font-family: 'Jost', sans-serif; font-size: 15px; color: var(--ink-dim); margin: 0 0 0.3rem; break-inside: avoid; }
.toc-h { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-gold); }
.toc a { font-family: 'Jost', sans-serif; font-size: 15px; color: var(--ink-secondary); text-decoration: none; border-bottom: 1px solid var(--rule); }
.toc a:hover { color: var(--ink-gold); }
.gkgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; margin: 0.75rem 0; }
.gkc { background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 0.8rem 1rem 0.3rem; }
.gkc .gk-num { font-size: 1.2rem; margin-top: 0.1rem; }
.gkc .gk-arc { font-size: 1.02rem; margin: 0 0 0.15rem; }
.gkc p.t { font-size: 0.98rem; }
.bars2 .bar { grid-template-columns: 5.5rem 1fr 1.5rem; }
.bars2 { margin: 0.5rem 0 0.75rem; }
.bars2 > div { background: none; border: none; padding: 0; }

@media (max-width: 760px) { .cards.c3, .gkgrid { grid-template-columns: 1fr; } }
</style>

// ── Session (shared with the portal via storage — same shape as chart-admin.html) ──
function readPortalSession() {
  for (const store of [sessionStorage, localStorage]) {
    try { const raw = store.getItem('portal_session'); if (!raw) continue; const s = JSON.parse(raw); if (s?.access_token) return s; } catch {}
  }
  return null;
}
function writePortalSession(s) { const p = JSON.stringify(s); try { sessionStorage.setItem('portal_session', p); } catch {} try { localStorage.setItem('portal_session', p); } catch {} }
let _refresh = null;
async function token() {
  const s = readPortalSession(); if (!s) return null;
  const now = Date.now(), expired = s.expires_at && now > s.expires_at;
  if (s.expires_at && now < s.expires_at - 60000) return s.access_token;
  if (!s.refresh_token) return expired ? null : s.access_token;

}
async function api(path, opts = {}) {

  if (res.status === 401) throw new Error('SESSION_EXPIRED');
  if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
  return res.status === 204 || opts.method === 'DELETE' || (opts.headers && opts.headers.Prefer === 'return=minimal') ? null : res.json();
}

function fmtTime(t) { const m = String(t || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return ''; let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${m[2]} ${ap}`; }

async function init() {

    render();
  } catch (e) {
    root.innerHTML = `<div class="msg">${e.message === 'SESSION_EXPIRED' ? 'Your session has expired. Please sign in to the portal again, then reopen your chart.' : 'Something went wrong loading the chart: ' + esc(e.message)}</div>`;
  }
}

async function load() {
  const id = S.clientId;
  const [client] = await get(`clients?id=eq.${id}&select=id,name,pronouns,access_chart,chart_sections&limit=1`);
  if (!client) throw new Error('Client not found');
  const q = {
    birth: get(`chart_birth_data?client_id=eq.${id}&limit=1`),
    planets: get(`chart_planets?client_id=eq.${id}&side=eq.personality&select=body,longitude,zodiac_sign,zodiac_degree,house,retrograde`),
    astro: get(`chart_astrology?client_id=eq.${id}&limit=1`),
    aspects: get(`chart_aspects?client_id=eq.${id}&select=body_a,body_b,aspect_type,orb,applying&order=orb.asc`),
    hd: get(`chart_human_design?client_id=eq.${id}&limit=1`),
    gk: get(`chart_gene_keys?client_id=eq.${id}&limit=1`),
    gkRef: get(`gene_keys_reference?select=number,shadow,gift,siddhi,theme,primary_field_id,shadow_field_id,gift_field_id,siddhi_field_id`),
    gkDesc: get(`gene_keys_descriptions?select=number,shadow_desc,gift_desc,siddhi_desc,status`),
    gkSubs: get(`gene_keys_subterrains?select=gene_key_number,subterrain_id,level,weight`),
    fields: get(`fields?select=id,number,name,tagline,arc&order=number`),
    subs: get(`subterrains?select=id,name,field_id,description`),
    signFields: get(`sign_field_activations?select=sign_name,field_id,is_secondary`),
    houseFields: get(`house_field_activations?select=house_number,field_id,is_secondary`),
    astSubs: get(`asteroid_subterrain_archetypes?select=body_name,subterrain_id,field_id,is_secondary`),
    weights: get(`chart_body_weights?select=body_name,body_weight`),
    channels: get(`hd_channels_reference?select=gate_a,gate_b,name,quality`),
    ref: get(`chart_reference_text?select=kind,key,title,body`),
    over: get(`client_chart_text?client_id=eq.${id}&select=section_key,body`),
    an: get(`client_chart_analysis?client_id=eq.${id}&select=content,status,updated_at,approved_at,synthesis_at`),
    syn: S.isAdmin ? get(`client_chart_synthesis?client_id=eq.${id}&select=updated_at`).catch(() => []) : Promise.resolve([]),
  };
  const D = { client };
  for (const [k, p] of Object.entries(q)) D[k] = await p;
  D.birth = D.birth[0] || null; D.astro = D.astro[0] || null; D.hd = D.hd[0] || null; D.gk = D.gk[0] || null;
  D.fieldById = Object.fromEntries(D.fields.map(f => [f.id, f]));
  D.subById = Object.fromEntries(D.subs.map(s => [s.id, s]));
  D.gkByNum = Object.fromEntries(D.gkRef.map(g => [g.number, g]));
  D.gkDesc.forEach(x => { if (D.gkByNum[x.number]) Object.assign(D.gkByNum[x.number], x); });
  D.REF = {}; D.ref.forEach(r => { (D.REF[r.kind] = D.REF[r.kind] || {})[r.key] = r; });
  D.OVER = Object.fromEntries(D.over.map(o => [o.section_key, o.body]));
  D.weightOf = Object.fromEntries(D.weights.map(w => [w.body_name, Number(w.body_weight) || 0.5]));
  D.AN = (Array.isArray(D.an) && D.an[0]) || null;
  D.SYN = (Array.isArray(D.syn) && D.syn[0]) || null;
  S.D = D;
}

// ── Text resolution ──
// Every editable block has a key. A per-client override (client_chart_text) wins over
// the default; an empty override hides the block for this client. `src` names the
// reference row the default came from, so an admin can also save to the reference.
function ref(kind, key) { return S.D.REF[kind]?.[key] || null; }
function refBody(kind, key) { return ref(kind, key)?.body || ''; }
function refTitle(kind, key, fb) { return ref(kind, key)?.title || fb; }
function block(key, def, src, cls = 't') {
  const has = Object.prototype.hasOwnProperty.call(S.D.OVER, key);
  const text = has ? S.D.OVER[key] : def;
  return { t: 'p', key, text, def, src, cls, overridden: has, hidden: has && !text.trim() };
}

// ── Sections ──
// clients.chart_sections holds the chosen keys (null = everything).
// Chapters (wheel, hd, each Gene Keys sequence, map) start a new PDF page;
// shorter sections flow on from the one before.
const SECTIONS = [
  { key: 'intro',         label: 'Introduction',                 group: 'Framing' },
  { key: 'wheel',         label: 'Chart wheel',                  group: 'Astrology', chapter: true },
  { key: 'big3',          label: 'Sun, Moon & Rising',           group: 'Astrology' },
  { key: 'planets',       label: 'Planets',                      group: 'Astrology', chapter: true },
  { key: 'points',        label: 'Angles, nodes & minor bodies', group: 'Astrology' },
  { key: 'aspects',       label: 'Aspects',                      group: 'Astrology' },
  { key: 'temperament',   label: 'Temperament',                  group: 'Astrology' },
  { key: 'hd',            label: 'Human Design',                 group: 'Human Design', chapter: true },
  { key: 'gk_activation', label: 'Activation Sequence',          group: 'Gene Keys', chapter: true },
  { key: 'gk_venus',      label: 'Venus Sequence',               group: 'Gene Keys', chapter: true },
  { key: 'gk_pearl',      label: 'Pearl Sequence',               group: 'Gene Keys', chapter: true },
  { key: 'map',           label: 'Frequencies on the Map',       group: 'The Map', chapter: true },
  { key: 'closing',       label: 'Closing',                      group: 'Framing' },
];
const SEC = Object.fromEntries(SECTIONS.map(s => [s.key, s]));
function included(key) { const sel = S.D.client.chart_sections; return !Array.isArray(sel) || sel.includes(key); }
function listJoin(a) { a = [...new Set(a)]; return a.length < 2 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1]; }
const cap1 = s => String(s || '').replace(/^\s*\w/, c => c.toUpperCase());
const fieldLabel = f => `${ROMAN[f.number]} · ${f.name}`;
const firstSentence = s => { const m = String(s || '').match(/^.*?[.!?](\s|$)/); return (m ? m[0] : String(s || '')).trim(); };

// Generated teaching text (client_chart_analysis). The admin always sees the latest
// draft; a client sees it only once it is approved. Falls back to reference text.
function AI(path) {
  const row = S.D.AN; if (!row || !row.content) return '';
  if (!S.isAdmin && row.status !== 'approved') return '';
  return path.split('.').reduce((o, k) => (o && o[k] != null ? o[k] : null), row.content) || '';
}

// ── Model ──
function buildModel() {
  const D = S.D, M = [];
  const name = D.client.name || 'Client';
  const b = D.birth;
  const birthLine = b ? [fmtDate(b.birth_date), fmtTime(b.birth_time), b.birth_place].filter(Boolean).join(' · ') : '';

  const s2f = {}, h2f = {}, b2s = {};
  D.signFields.forEach(x => (s2f[x.sign_name] = s2f[x.sign_name] || []).push(x));
  D.houseFields.forEach(x => (h2f[x.house_number] = h2f[x.house_number] || []).push(x));
  D.astSubs.forEach(x => (b2s[x.body_name] = b2s[x.body_name] || []).push(x));
  const byBody = Object.fromEntries(D.planets.map(p => [p.body, p]));
  const fieldScore = {}, fieldSources = {}, subHits = {};
  const credit = (fid, w, label) => { if (!fid || !D.fieldById[fid]) return; fieldScore[fid] = (fieldScore[fid] || 0) + w; (fieldSources[fid] = fieldSources[fid] || new Set()).add(label); };
  const creditSub = (sid, label) => { if (!D.subById[sid]) return; (subHits[sid] = subHits[sid] || new Set()).add(label); };
  const P = {};
  D.planets.forEach(p => {
    const title = refTitle('body', p.body, cap(p.body));
    const w = D.weightOf[p.body] ?? 0.5;
    const seen = new Map();
    [...(s2f[p.zodiac_sign] || []), ...(h2f[p.house] || [])].forEach(x => { const f = D.fieldById[x.field_id]; if (f && !seen.has(f.id)) seen.set(f.id, { f, sec: x.is_secondary }); });
    const fl = [...seen.values()];
    fl.forEach(x => credit(x.f.id, x.sec ? w * 0.5 : w, title));
    const subs = (b2s[p.body] || []).map(x => D.subById[x.subterrain_id]).filter(Boolean);
    subs.forEach(s => { creditSub(s.id, title); credit(s.field_id, w * 0.5, title); });
    const deg = p.zodiac_degree != null ? Math.floor(Number(p.zodiac_degree)) + '°' : '';
    const sign = cap(p.zodiac_sign);
    const signTxt = refBody('sign', p.zodiac_sign);
    P[p.body] = { title, sign, fields: fl.map(x => x.f), subs,
      pos: [deg && sign ? `${deg} ${sign}` : sign, p.house ? `${ORD(p.house)} house` : '', p.retrograde ? 'Rx' : ''].filter(Boolean).join(' · '),
      fallback: [refBody('body', p.body), signTxt ? `In ${sign}, it is ${signTxt}` : ''].filter(Boolean).join(' ') };
  });
  const placeCard = body => {
    const x = P[body];
    return { title: body === 'ascendant' ? `Rising · ${x.sign}` : `${x.title} · ${x.sign}`, meta: x.pos,
      chips: x.fields.map(fieldLabel),
      children: [block(`place:${body}`, AI(`placements.${body}`) || x.fallback, null)] };
  };

  // GK first so the Map credits them even if the GK sections are hidden.
  const GKS = {};
  if (D.gk) for (const [secKey, spheres] of SEQUENCES) {
    GKS[secKey] = [];
    for (const [sp] of spheres) {
      const num = D.gk[`gk_${sp}`], line = D.gk[`gk_${sp}_line`];
      if (!num) continue;
      const g = D.gkByNum[num]; if (!g) continue;
      const sphereTitle = refTitle('sphere', sp, cap(sp));
      const home = D.fieldById[g.primary_field_id];
      const w = (['lifes_work', 'evolution', 'radiance', 'purpose', 'core'].includes(sp)) ? 1 : 0.6;
      const label = `Gene Key ${num} (${sphereTitle})`;
      if (home) credit(home.id, w, label);
      const subs = D.gkSubs.filter(x => x.gene_key_number === num).map(x => D.subById[x.subterrain_id]).filter(Boolean);
      subs.forEach(s => creditSub(s.id, label));
      GKS[secKey].push({ t: 'gkc', sphere: sphereTitle, num, line, arc: [g.shadow, g.gift, g.siddhi], field: home ? `Field ${fieldLabel(home)}` : '',
        p: block(`gk:${num}:${sp}`, AI(`gk.${sp}`) || firstSentence(g.gift_desc), null) });
    }
  }

  // ── Page one: cover + introduction
  M.push({ t: 'cover', text: name, sub: birthLine });
  const contents = SECTIONS.filter(s => s.key !== 'intro' && included(s.key)).map(s => ({ key: s.key, label: s.label }));
  if (included('intro')) M.push({ t: 'section', key: 'intro', title: 'Your Chart Analysis', children: [
    block('section:intro', AI('intro') || refBody('section', 'intro'), AI('intro') ? null : { kind: 'section', key: 'intro' }, 't lead'),
    block('section:how_to_read', refBody('section', 'how_to_read'), { kind: 'section', key: 'how_to_read' }, 't quiet'),
    { t: 'toc', items: contents },
  ] });

  // ── Astrology
  if (D.planets.length) {
    if (included('wheel')) M.push({ t: 'section', key: 'wheel', eyebrow: 'Astrology', title: 'The Sky at Your Birth', children: [
      block('section:sky', refBody('section', 'sky'), { kind: 'section', key: 'sky' }),
      { t: 'wheel' },
      { t: 'meta', text: 'Tropical zodiac · Placidus houses · solid lines: squares and oppositions · dashed: trines and sextiles' },
    ] });
    const big = ['sun', 'moon', 'ascendant'].filter(x => P[x]);
    if (included('big3') && big.length) M.push({ t: 'section', key: 'big3', eyebrow: 'Astrology', title: 'Sun, Moon & Rising', children: [
      { t: 'cards', cols: 3, items: big.map(placeCard) },
    ] });
    const pl = ['mercury', 'venus', 'mars', 'jupiter', 'saturn', 'uranus', 'neptune', 'pluto'].filter(x => P[x]);
    if (included('planets') && pl.length) M.push({ t: 'section', key: 'planets', eyebrow: 'Astrology', title: 'The Planets', children: [
      { t: 'cards', cols: 2, items: pl.map(placeCard) },
    ] });
    const pts = ['midheaven', 'imum_coeli', 'north_node', 'south_node', 'chiron', 'lilith', 'ceres', 'pallas_athena', 'juno', 'vesta', 'astraea', 'hygeia', 'eris', 'haumea', 'sedna', 'nessus', 'chariklo'].filter(x => P[x]);
    if (included('points') && pts.length) M.push({ t: 'section', key: 'points', eyebrow: 'Astrology', title: 'Angles, Nodes & Minor Bodies', children: [
      block('ai:points', AI('points') || 'The angles and nodes describe direction; Chiron, Lilith and the minor bodies name the finer currents, and on the Map they light specific Subterrains.', null),
      { t: 'table', cls: 'points', head: ['Body', 'Position', 'On the Map'],
        rows: pts.map(x => [P[x].title, P[x].pos, [...P[x].fields.map(fieldLabel), ...P[x].subs.map(s => `*${s.name}*`)].join(' · ') || '—']) },
    ] });
    const asp = D.aspects.filter(a => ASPECT_BODIES.has(a.body_a) && ASPECT_BODIES.has(a.body_b)).slice(0, 8);
    if (included('aspects') && asp.length) M.push({ t: 'section', key: 'aspects', eyebrow: 'Astrology', title: 'Aspects', children: [
      block('ai:aspects', AI('aspects') || refBody('section', 'aspects'), null),
      { t: 'table', cls: 'aspects', head: ['Between', 'Aspect', 'Orb', 'Tone'],
        rows: asp.map(a => [`${refTitle('body', a.body_a, cap(a.body_a))} – ${refTitle('body', a.body_b, cap(a.body_b))}`, refTitle('aspect', a.aspect_type, cap(a.aspect_type)), `${Number(a.orb).toFixed(1)}°`, cap1(String(refBody('aspect', a.aspect_type)).split(/[;—]/)[0].replace(/\.$/, ''))]) },
    ] });
    const el = { Fire: 0, Earth: 0, Air: 0, Water: 0 }, mo = { Cardinal: 0, Fixed: 0, Mutable: 0 }; let n = 0;
    BALANCE.forEach(x => { const p = byBody[x]; if (p && ELEMENTS[p.zodiac_sign]) { el[ELEMENTS[p.zodiac_sign]]++; mo[MODES[p.zodiac_sign]]++; n++; } });
    if (included('temperament') && n) {
      const topE = Object.entries(el).sort((a, b) => b[1] - a[1])[0][0], topM = Object.entries(mo).sort((a, b) => b[1] - a[1])[0][0];
      M.push({ t: 'section', key: 'temperament', eyebrow: 'Astrology', title: 'Temperament', children: [
        { t: 'bars2', groups: [
          { title: 'Elements', rows: Object.entries(el).map(([k, v]) => ({ label: k, v, pct: Math.round(v / n * 100) })) },
          { title: 'Modalities', rows: Object.entries(mo).map(([k, v]) => ({ label: k, v, pct: Math.round(v / n * 100) })) },
        ] },
        block('temperament:summary', AI('temperament') || `Your chart leans toward ${topE} and ${topM} energy. ${refBody('temperament', topE)} ${refBody('temperament', topM)}`, null),
      ] });
    }
  }

  // ── Human Design
  const hd = D.hd;
  if (hd && included('hd')) {
    const T = ref('hd_type', hd.type), A = ref('hd_authority', hd.authority), Df = ref('hd_definition', hd.definition_type);
    const strategy = (T?.body.match(/Your strategy is to ([^.]+)\./) || [])[1] || '';
    const ch = [
      { t: 'table', cls: 'kv', head: [], rows: [
        ['Type', `${T?.title || cap(hd.type)}${strategy ? ` — strategy: ${strategy}` : ''}`],
        ['Authority', `${A?.title || cap(hd.authority)}${A ? ` — ${firstSentence(A.body)}` : ''}`],
        ['Profile', hd.profile || '—'],
        ['Definition', Df?.title || cap(hd.definition_type)],
      ] },
      block('ai:hd', AI('hd') || [T?.body, A?.body].filter(Boolean).join(' '), null),
    ];
    const dc = (hd.defined_centers || []).map(c => ref('hd_center_defined', c)).filter(Boolean);
    const oc = (hd.open_centers || []).map(c => ref('hd_center_open', c)).filter(Boolean);
    ch.push({ t: 'cols', items: [
      { title: 'Defined — consistent in you', list: dc.map(r => ({ label: r.title, text: r.body.replace(/^Defined: /, '') })) },
      { title: 'Open — where you take in and learn', list: oc.map(r => ({ label: r.title, text: r.body.replace(/^Open: /, '') })) },
    ] });
    const chans = (hd.defined_channels || []).map(([a, b]) => D.channels.find(c => (c.gate_a === a && c.gate_b === b) || (c.gate_a === b && c.gate_b === a)) || { gate_a: a, gate_b: b });
    if (chans.length) ch.push({ t: 'meta', text: 'Defined channels: ' + chans.map(c => `${c.gate_a}–${c.gate_b}${c.name ? ' ' + c.name : ''}`).join(' · ') });
    M.push({ t: 'section', key: 'hd', eyebrow: 'Human Design', title: 'Human Design', children: ch });
  }

  // ── Gene Keys (one page per sequence)
  let firstGK = true;
  for (const [secKey] of SEQUENCES) {
    const cards = GKS[secKey] || [];
    if (!included(secKey) || !cards.length) continue;
    const seqName = secKey.replace('gk_', '');
    const intro = AI(`gk_sequences.${seqName}`) || refBody('section', secKey);
    M.push({ t: 'section', key: secKey, eyebrow: 'Gene Keys', title: refTitle('section', secKey, cap(secKey)), children: [
      ...(firstGK ? [block('section:gk_short', 'Each Gene Key is one frequency with a range: the shadow, where it runs contracted; the gift, the same energy matured; the siddhi, its furthest reach.', null, 't quiet')] : []),
      block(`ai:gkseq:${seqName}`, intro, null),
      { t: 'gkgrid', items: cards },
    ] });
    firstGK = false;
  }

  // ── The Map (concise)
  const ranked = Object.entries(fieldScore).map(([id, s]) => ({ f: D.fieldById[id], s })).filter(x => x.f).sort((a, b) => b.s - a.s);
  if (ranked.length && included('map')) {
    const order = (S.D.AN && S.D.AN.content && Array.isArray(S.D.AN.content.map_field_order) && S.D.AN.content.map_field_order.length && AI('map_summary')) ? S.D.AN.content.map_field_order : null;
    const top = order ? order.map(nm => ranked.find(x => x.f.number === nm)).filter(Boolean) : ranked.slice(0, 5);
    M.push({ t: 'section', key: 'map', eyebrow: 'The Map', title: 'Your Frequencies on the Map', children: [
      block('ai:map', AI('map_summary') || refBody('section', 'map'), null),
      { t: 'table', cls: 'map', head: ['Field', 'What it holds', 'In your chart'],
        rows: top.map(x => {
          const f = x.f, src = [...(fieldSources[f.id] || [])];
          const subs = Object.keys(subHits).map(id => D.subById[id]).filter(s => s && s.field_id === f.id).slice(0, 3).map(s => `*${s.name}*`);
          const teach = AI(`map_fields.${f.number}`) || `Lit by ${listJoin(src)}.`;
          return [fieldLabel(f), firstSentence(f.tagline), teach + (subs.length ? ` Subterrains: ${subs.join(', ')}.` : '')];
        }) },
      ...(ranked.length > top.length ? [{ t: 'meta', text: 'Also present: ' + ranked.filter(x => !top.includes(x)).map(x => fieldLabel(x.f)).join(' · ') }] : []),
    ] });
  }

  if (included('closing')) M.push({ t: 'section', key: 'closing', title: 'Carrying This Forward', children: [
    block('section:closing', AI('closing') || refBody('section', 'closing'), AI('closing') ? null : { kind: 'section', key: 'closing' }, 't lead'),
  ] });
  return M;
}

// ── HTML render ──
function pHTML(n) {
  if (!n) return '';
  if (!n.text && !S.isAdmin) return '';
  const pen = S.isAdmin ? `<button class="pen" data-key="${esc(n.key)}">Edit</button>` : '';
  if (n.hidden) return S.isAdmin ? `<p class="t ed overridden"><span class="hidden-note">Hidden for this client.</span>${pen}</p>` : '';
  if (!n.text) return `<p class="t ed"><span class="hidden-note">No text yet.</span>${pen}</p>`;
  return `<p class="${n.cls} ed${n.overridden ? ' overridden' : ''}" data-key="${esc(n.key)}">${md(n.text)}${pen}</p>`;
}
const chipsHTML = list => list && list.length ? `<div class="chips">${list.map(x => `<span class="chip">${esc(x)}</span>`).join('')}</div>` : '';
function nodeHTML(n) {
  switch (n.t) {
    case 'cover': return `<header class="cover"><div class="eyebrow">Chart Analysis</div><h1 class="title">${esc(n.text)}</h1>${n.sub ? `<div class="subtitle">${esc(n.sub)}</div>` : ''}</header>`;
    case 'section': return `<section class="part${SEC[n.key]?.chapter ? ' chapter' : ''}" id="sec-${n.key}">${n.eyebrow ? `<div class="eyebrow">${esc(n.eyebrow)}</div>` : ''}<h2>${esc(n.title)}</h2>${n.children.map(nodeHTML).join('')}</section>`;
    case 'p': return pHTML(n);
    case 'meta': return `<div class="meta">${md(n.text)}</div>`;
    case 'toc': return n.items.length ? `<nav class="toc"><div class="toc-h">In this analysis</div><ol>${n.items.map(i => `<li><a href="#sec-${i.key}">${esc(i.label)}</a></li>`).join('')}</ol></nav>` : '';
    case 'wheel': return `<div id="wheel-wrap">${wheelSVG()}</div>`;
    case 'cards': return `<div class="cards c${n.cols}">${n.items.map(c => `<div class="card"><div class="card-h">${esc(c.title)}</div><div class="meta">${esc(c.meta)}</div>${chipsHTML(c.chips)}${c.children.map(nodeHTML).join('')}</div>`).join('')}</div>`;
    case 'table': return `<div class="tablewrap"><table class="tbl ${n.cls || ''}">${n.head.length ? `<thead><tr>${n.head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead>` : ''}<tbody>${n.rows.map(r => `<tr>${r.map((c, i) => `<td${i === 0 ? ' class="first"' : ''}>${md(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    case 'cols': return `<div class="cols2">${n.items.map(c => `<div class="col"><h4>${esc(c.title)}</h4><ul class="bul">${c.list.map(i => `<li><b>${esc(i.label)}</b> — ${md(i.text)}</li>`).join('') || '<li>None</li>'}</ul></div>`).join('')}</div>`;
    case 'bars2': return `<div class="cols2 bars2">${n.groups.map(g => `<div><h4>${esc(g.title)}</h4>${g.rows.map(r => `<div class="bar"><span>${esc(r.label)}</span><span class="track"><span class="fill" style="width:${r.pct}%"></span></span><span>${r.v}</span></div>`).join('')}</div>`).join('')}</div>`;
    case 'gkgrid': return `<div class="gkgrid">${n.items.map(k => `<div class="gkc">
        <div class="gk-sphere">${esc(k.sphere)}</div>
        <div class="gk-num">Gene Key ${k.num}.${k.line}</div>
        <div class="gk-arc">${k.arc.map(esc).join(' <span>→</span> ')}</div>
        ${k.field ? `<div class="meta">${esc(k.field)}</div>` : ''}
        ${pHTML(k.p)}</div>`).join('')}</div>`;
  }
  return '';
}

async function generateAnalysis(btn) {

}

function findNode(key, list = S.model) {
  for (const n of list || []) {
    if (!n) continue;
    if (n.t === 'p' && n.key === key) return n;
    const kids = [...(n.children || []), ...((n.items || []).flatMap(i => i ? [...(i.children || []), i.p].filter(Boolean) : []))];
    const f = findNode(key, kids); if (f) return f;
  }
  return null;
}

// ── PDF ──
// White page, ink text, outlined boxes, no fills. Chapters start a new page; shorter
// sections flow on. Cards sit side by side and are never split across pages.
function pdfText(s) {
  return plain(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/—/g, ' - ').replace(/–/g, '-').replace(/→/g, '>').replace(/…/g, '...').replace(/[^\x00-\xFF]/g, '');
}
// The PDF opens in a small viewer page with its own Print and Download buttons, so the
// downloaded file keeps the client's name (a browser's built-in viewer would save a blob id).
function showPdfViewer(win, url, fname, title) {
  const e = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  win.document.open();
  win.document.write(`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${e(title)}</title>
<style>
  html, body { margin: 0; height: 100%; background: #fbf7ec; font-family: Jost, Helvetica, Arial, sans-serif; }
  .bar { height: 56px; display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0 1.25rem; background: #efe7d2; color: #14110a; border-bottom: 1px solid rgba(122,86,24,0.3); box-sizing: border-box; }
  .bar .t { font-family: Georgia, serif; font-size: 18px; }
  .bar .b { display: flex; gap: 0.6rem; }
  .bar a, .bar button { font: 500 15px Jost, Helvetica, Arial, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 16px; border-radius: 3px; border: 1px solid #7a5618; background: transparent; color: #7a5618; cursor: pointer; text-decoration: none; }
  .bar .solid { background: #7a5618; color: #fbf7ec; border-color: #7a5618; }
  iframe { display: block; width: 100%; height: calc(100% - 56px); border: 0; }
</style></head><body>
  <div class="bar"><span class="t">${e(title)}</span><span class="b">
    <button class="solid" id="p">Print</button>
    <a id="d" href="${url}" download="${e(fname)}">Download</a>
  </span></div>
  <iframe id="f" src="${url}#toolbar=0&view=FitH" title="${e(title)}"></iframe>
</body></html>`);
  win.document.close();
  win.document.getElementById('p').onclick = () => {
    try { win.document.getElementById('f').contentWindow.focus(); win.document.getElementById('f').contentWindow.print(); }
    catch { win.location.href = url; }   // browsers that can't print an embedded PDF: open it directly
  };
}

async function downloadPdf(btn) {
  const JS = window.jspdf && window.jspdf.jsPDF; if (!JS) { alert('The PDF tool is still loading. Try again in a moment.'); return; }
  // Open the tab now, inside the click, so the browser doesn't block it; the PDF loads into it
  // when ready and opens in the browser's viewer, where it can be printed or downloaded.
  const win = window.open('', '_blank');
  if (win) { try { win.document.title = 'Preparing chart analysis…'; win.document.body.style.cssText = 'font-family:Georgia,serif;font-size:18px;color:#2b2414;background:#fbf7ec;padding:3rem'; win.document.body.textContent = 'Preparing the chart analysis…'; } catch {} }
  btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    // Two passes: the first lays the whole PDF out to learn the page each section starts on;
    // the second draws it again with those page numbers in the contents list. The contents
    // box is the same height either way, so nothing moves between passes.
    let wheelImg = null;
    const build = async (tocPages) => {
    const starts = {};
    const doc = new JS({ unit: 'pt', format: 'letter' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 54, maxW = W - 2 * M, BOTTOM = H - 50;
    const INK = [20, 17, 10], DIM = [62, 52, 32], GOLD = [90, 63, 16], RULE = [140, 122, 85];
    const name = S.D.client.name || 'Client';
    let y = M, page = 1;
    const footer = () => { doc.setFont('times', 'normal'); doc.setFontSize(9.5); doc.setTextColor(...DIM); doc.text(pdfText(`${name} · Chart Analysis · ${page}`), W / 2, H - 28, { align: 'center' }); };
    const newPage = () => { footer(); doc.addPage(); page++; y = M; };
    const ensure = h => { if (y + h > BOTTOM) newPage(); };
    const STY = {
      body:  { family: 'times', font: 'normal', size: 10.5, color: INK, lead: 1.34, after: 6 },
      lead:  { family: 'times', font: 'normal', size: 11.5, color: INK, lead: 1.36, after: 6 },
      quiet: { family: 'times', font: 'italic', size: 10, color: DIM, lead: 1.32, after: 6 },
      title: { family: 'times', font: 'normal', size: 26, color: INK, lead: 1.15, after: 4 },
      h2:    { family: 'times', font: 'normal', size: 17, color: INK, lead: 1.2, after: 3 },
      h3:    { family: 'times', font: 'bold', size: 11.5, color: INK, lead: 1.25, after: 2 },
      label: { family: 'helvetica', font: 'bold', size: 8.5, color: GOLD, lead: 1.3, after: 2 },
      meta:  { family: 'helvetica', font: 'normal', size: 8.5, color: DIM, lead: 1.35, after: 3 },
      small: { family: 'times', font: 'normal', size: 10, color: INK, lead: 1.3, after: 3 },
      cell1: { family: 'times', font: 'bold', size: 10, color: INK, lead: 1.3, after: 3 },
    };
    const lay = (text, st, w) => { const s = STY[st]; doc.setFont(s.family, s.font); doc.setFontSize(s.size); const lines = text ? doc.splitTextToSize(pdfText(text), w) : []; return { lines, s, h: lines.length * s.size * s.lead + (lines.length ? s.after : 0) }; };
    const put = (r, x) => { const s = r.s; doc.setFont(s.family, s.font); doc.setFontSize(s.size); doc.setTextColor(...s.color); r.lines.forEach(l => { doc.text(l, x, y + s.size); y += s.size * s.lead; }); if (r.lines.length) y += s.after; };
    const flow = (text, st) => { const r = lay(text, st, maxW); const s = r.s; r.lines.forEach(l => { ensure(s.size * s.lead); doc.setFont(s.family, s.font); doc.setFontSize(s.size); doc.setTextColor(...s.color); doc.text(l, M, y + s.size); y += s.size * s.lead; }); if (r.lines.length) y += s.after; };
    const txt = p => (p && !p.hidden && p.text) ? p.text : '';
    // Boxes in a row: measure each at column width, keep the row together, outline each.
    const boxRow = (boxes, cols, pad = 9, gap = 8) => {
      const cw = (maxW - gap * (cols - 1)) / cols;
      for (let i = 0; i < boxes.length; i += cols) {
        const row = boxes.slice(i, i + cols).map(runs => runs.filter(r => r && r[0]).map(([t, st]) => lay(t, st, cw - 2 * pad)));
        const h = Math.max(...row.map(rs => rs.reduce((t, r) => t + r.h, 0))) + 2 * pad - 2;
        ensure(h + gap);
        const y0 = y;
        row.forEach((rs, j) => { const x = M + j * (cw + gap); y = y0 + pad; rs.forEach(r => put(r, x + pad)); doc.setDrawColor(...RULE); doc.setLineWidth(0.6); doc.rect(x, y0, cw, h); });
        y = y0 + h + gap;
      }
    };
    const table = (head, rows, cls) => {
      const widths = cls === 'kv' ? [0.2, 0.8] : cls === 'aspects' ? [0.34, 0.16, 0.1, 0.4] : cls === 'map' ? [0.24, 0.32, 0.44] : [0.26, 0.24, 0.5];
      const cw = widths.map(f => f * maxW), pad = 4;
      const drawRow = (cells, header) => {
        const laid = cells.map((c, i) => lay(header ? String(c).toUpperCase() : c, header ? 'label' : (i === 0 ? 'cell1' : 'small'), cw[i] - 2 * pad));
        const h = Math.max(...laid.map(r => r.h)) + 2 * pad;
        ensure(h);
        let x = M; const y0 = y;
        laid.forEach((r, i) => { y = y0 + pad; put(r, x + pad); x += cw[i]; });
        y = y0 + h;
        doc.setDrawColor(...RULE); doc.setLineWidth(header ? 0.9 : 0.4); doc.line(M, y, M + maxW, y);
      };
      if (head.length) drawRow(head, true);
      rows.forEach(r => drawRow(r, false));
      y += 8;
    };
    // Height of a section's first block, so a heading never sits alone at the foot of a page.
    const firstBlockHeight = c => {
      if (!c) return 0;
      const rowH = (boxes, cols) => { const cw = (maxW - 8 * (cols - 1)) / cols; return Math.max(...boxes.slice(0, cols).map(runs => runs.filter(r => r && r[0]).reduce((t, [tx, st]) => t + lay(tx, st, cw - 18).h, 0))) + 18; };
      if (c.t === 'cards') return rowH(c.items.map(k => [[k.title, 'h3'], [k.meta, 'meta'], [k.chips && k.chips.join(' · '), 'meta'], ...k.children.map(p => [txt(p), 'small'])]), c.cols);
      if (c.t === 'p') return Math.min(lay(txt(c), 'body', maxW).h, 120);
      if (c.t === 'bars2') return 90;
      if (c.t === 'table') return 60;
      return 80;
    };
    const walk = async n => {
      switch (n.t) {
        case 'cover':
          flow('NAVIGATION MAP · CHART ANALYSIS', 'label'); y += 4;
          flow(n.text, 'title'); if (n.sub) flow(n.sub, 'meta');
          doc.setDrawColor(...GOLD); doc.setLineWidth(0.8); doc.line(M, y + 4, M + 140, y + 4); y += 18;
          break;
        case 'section':
          if (SEC[n.key]?.chapter) newPage(); else { if (y > M + 30) y += 12; ensure(48 + firstBlockHeight(n.children[0])); }
          starts[n.key] = page;
          if (n.eyebrow) flow(n.eyebrow.toUpperCase(), 'label');
          flow(n.title, 'h2');
          doc.setDrawColor(...GOLD); doc.setLineWidth(0.5); doc.line(M, y, W - M, y); y += 10;
          for (const c of n.children) await walk(c);
          break;
        case 'p': if (txt(n)) flow(n.text, n.cls.includes('lead') ? 'lead' : n.cls.includes('quiet') ? 'quiet' : 'body'); break;
        case 'meta': flow(n.text, 'meta'); break;
        case 'toc': if (n.items.length) {
          const half = Math.ceil(n.items.length / 2), lh = 14, pad = 10, h = pad * 2 + 14 + half * lh;
          ensure(h + 8); const y0 = y;
          doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...GOLD); doc.text('IN THIS ANALYSIS', M + pad, y0 + pad + 8);
          doc.setFont('times', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...INK);
          n.items.forEach((it, i) => {
            const col = i < half ? 0 : 1, row = i < half ? i : i - half, x0 = M + pad + col * (maxW / 2), yy = y0 + pad + 14 + row * lh + 9;
            doc.text(pdfText(`${i + 1}.  ${it.label}`), x0, yy);
            if (tocPages && tocPages[it.key]) doc.text(String(tocPages[it.key]), x0 + maxW / 2 - 2 * pad - 6, yy, { align: 'right' });
          });
          doc.setDrawColor(...RULE); doc.setLineWidth(0.6); doc.rect(M, y0, maxW, h); y = y0 + h + 8;
        } break;
        case 'wheel': { const img = wheelImg || (wheelImg = await wheelPNG()); const sz = Math.min(maxW, 300); ensure(sz + 8); doc.addImage(img, 'JPEG', (W - sz) / 2, y, sz, sz); y += sz + 8; break; }
        case 'cards': boxRow(n.items.map(c => [[c.title, 'h3'], [c.meta, 'meta'], [c.chips && c.chips.length ? c.chips.join(' · ') : '', 'meta'], ...c.children.map(p => [txt(p), 'small'])]), n.cols); break;
        case 'gkgrid': boxRow(n.items.map(k => [[k.sphere.toUpperCase(), 'label'], [`Gene Key ${k.num}.${k.line}`, 'h3'], [k.arc.join('  >  '), 'quiet'], [k.field, 'meta'], [txt(k.p), 'small']]), 2); break;
        case 'table': table(n.head, n.rows.map(r => r.map(c => plain(c))), n.cls); break;
        case 'cols': boxRow(n.items.map(c => [[c.title.toUpperCase(), 'label'], ...(c.list.length ? c.list : [{ label: 'None', text: '' }]).map(i => [`${i.label}${i.text ? ' - ' + i.text : ''}`, 'small'])]), 2); break;
        case 'bars2': {
          ensure(90); const y0 = y, half = (maxW - 20) / 2;
          let yEnd = y0;
          n.groups.forEach((g, gi) => {
            y = y0; const x0 = M + gi * (half + 20);
            doc.setFont('helvetica', 'bold'); doc.setFontSize(8.5); doc.setTextColor(...GOLD); doc.text(g.title.toUpperCase(), x0, y + 9); y += 14;
            g.rows.forEach(r => { doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(...INK); doc.text(r.label, x0, y + 9); const bx = x0 + 58, bw = half - 80; doc.setDrawColor(...DIM); doc.setLineWidth(0.5); doc.rect(bx, y + 2, bw, 7); doc.setFillColor(...INK); doc.rect(bx, y + 2, bw * r.pct / 100, 7, 'F'); doc.text(String(r.v), x0 + half - 8, y + 9, { align: 'right' }); y += 14; });

// ── Admin editing ──
function openEditor(key) {
  const n = findNode(key); if (!n) return;

  const refLabel = n.src ? (n.src.gk ? `Gene Key ${n.src.gk} reference (every client with this key)` : `the reference text (every client)`) : '';

    <div class="row">
      <button class="btn btn-solid" data-a="client">Save for this client</button>
      ${n.src ? `<button class="btn" data-a="ref">Save to reference</button>` : ''}
      ${n.overridden ? `<button class="btn" data-a="reset">Reset to default</button>` : ''}
      <button class="btn" data-a="hide">Hide for this client</button>
      <button class="btn" data-a="cancel">Cancel</button>
      <span class="why">Wrap a Subterrain name in *asterisks* for italics.${n.src ? ` “Save to reference” changes ${refLabel}.` : ' This passage is assembled from reference pieces, so edits apply to this client only.'}</span>
    </div>`;

async function saveEdit(n, action, value, ed) {
  if (action === 'cancel') { ed.remove(); return; }
  const D = S.D, cid = D.client.id;
  ed.querySelectorAll('button').forEach(b => b.disabled = true);
  try {
    if (action === 'client' || action === 'hide') {
      const body = action === 'hide' ? '' : value.trim();
      await api(`client_chart_text?on_conflict=client_id,section_key`, { method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ client_id: cid, section_key: n.key, body, updated_at: new Date().toISOString() }) });
      D.OVER[n.key] = body;
    } else if (action === 'reset') {
      await api(`client_chart_text?client_id=eq.${cid}&section_key=eq.${encodeURIComponent(n.key)}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } });
      delete D.OVER[n.key];
    } else if (action === 'ref') {
      const v = value.trim();
      if (!confirm('Save this text to the reference? It will change this passage for every client.')) { ed.querySelectorAll('button').forEach(b => b.disabled = false); return; }
      if (n.src.gk) { await api(`gene_keys_descriptions?number=eq.${n.src.gk}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ [n.src.col]: v }) }); D.gkByNum[n.src.gk][n.src.col] = v; }
      else { await api(`chart_reference_text?kind=eq.${n.src.kind}&key=eq.${encodeURIComponent(n.src.key)}`, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: JSON.stringify({ body: v, updated_at: new Date().toISOString() }) }); const r = D.REF[n.src.kind]?.[n.src.key]; if (r) r.body = v; }
      if (Object.prototype.hasOwnProperty.call(D.OVER, n.key)) { await api(`client_chart_text?client_id=eq.${cid}&section_key=eq.${encodeURIComponent(n.key)}`, { method: 'DELETE', headers: { Prefer: 'return=minimal' } }); delete D.OVER[n.key]; }
    }
    const y = window.scrollY; render(); window.scrollTo(0, y);
    document.getElementById('ab-status').textContent = 'saved · ' + new Date().toLocaleTimeString();
  } catch (e) {
    alert('Save failed: ' + e.message);
    ed.querySelectorAll('button').forEach(b => b.disabled = false);
  }
}

// ── Chart wheel (SVG) ──
const GLYPH = { sun: '☉', moon: '☽', mercury: '☿', venus: '♀', mars: '♂', jupiter: '♃', saturn: '♄', uranus: '♅', neptune: '♆', pluto: '♇', chiron: '⚷', north_node: '☊', south_node: '☋', lilith: '⚸' };
const SIGN_GLYPH = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
const SIGN_ABBR = ['Ari', 'Tau', 'Gem', 'Can', 'Leo', 'Vir', 'Lib', 'Sco', 'Sag', 'Cap', 'Aqu', 'Pis'];
function wheelSVG(forPrint) {
  const D = S.D, pl = Object.fromEntries(D.planets.map(p => [p.body, p]));
  const asc = Number(D.astro?.ascendant ?? pl.ascendant?.longitude ?? 0);
  const C = 300, R1 = 288, R2 = 248, R3 = 212, R4 = 120;
  const ang = L => (180 + (L - asc)) * Math.PI / 180;            // Ascendant at 9 o'clock, counter-clockwise
  const pt = (L, r) => [C + r * Math.cos(ang(L)), C - r * Math.sin(ang(L))];
  const ink = '#14110a', gold = '#7a5618', dim = '#4e4228';
  const sym = forPrint ? 'font-family="DejaVu Sans, Segoe UI Symbol, Apple Symbols, sans-serif"' : 'font-family="Segoe UI Symbol, Apple Symbols, Noto Sans Symbols 2, DejaVu Sans, sans-serif"';
  let s = `<svg class="wheel" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Natal chart wheel">`;
  s += `<rect width="600" height="600" fill="${forPrint ? '#ffffff' : 'none'}"/>`;
  [R1, R2, R3, R4].forEach((r, i) => s += `<circle cx="${C}" cy="${C}" r="${r}" fill="none" stroke="${i === 3 ? dim : ink}" stroke-width="${i === 0 ? 1.6 : 1}"/>`);
  for (let i = 0; i < 12; i++) {
    const L = i * 30, [x1, y1] = pt(L, R2), [x2, y2] = pt(L, R1);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink}" stroke-width="1"/>`;
    for (let d = 5; d < 30; d += 5) { const [a, b] = pt(L + d, R2), [c, e] = pt(L + d, R2 + (d % 10 ? 5 : 8)); s += `<line x1="${a}" y1="${b}" x2="${c}" y2="${e}" stroke="${dim}" stroke-width="0.7"/>`; }
    const [tx, ty] = pt(L + 15, (R1 + R2) / 2);
    s += `<text x="${tx}" y="${ty}" text-anchor="middle" dominant-baseline="central" font-size="22" fill="${gold}" ${sym}>${SIGN_GLYPH[i]}&#xFE0E;</text>`;
  }
  const cusps = Array.isArray(D.astro?.house_cusps) ? D.astro.house_cusps.map(Number) : (D.astro?.house_cusps ? Object.values(D.astro.house_cusps).map(Number) : []);
  cusps.forEach((L, i) => {
    const angular = i % 3 === 0, [x1, y1] = pt(L, R4), [x2, y2] = pt(L, angular ? R1 + 8 : R3);
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${ink}" stroke-width="${angular ? 2 : 0.8}"/>`;
    const next = cusps[(i + 1) % 12], span = ((next - L) + 360) % 360, [nx, ny] = pt(L + span / 2, R4 + 14);
    s += `<text x="${nx}" y="${ny}" text-anchor="middle" dominant-baseline="central" font-size="13" font-family="Jost, Arial, sans-serif" fill="${dim}">${i + 1}</text>`;
  });
  if (cusps.length) { const [ax, ay] = pt(cusps[0], R1 + 14); s += `<text x="${ax - 10}" y="${ay}" text-anchor="end" dominant-baseline="central" font-size="14" font-family="Jost, Arial, sans-serif" fill="${ink}">ASC</text>`; const [mx, my] = pt(cusps[9], R1 + 14); s += `<text x="${mx}" y="${my - 6}" text-anchor="middle" font-size="14" font-family="Jost, Arial, sans-serif" fill="${ink}">MC</text>`; }
  // aspect lines among the major bodies
  D.aspects.filter(a => GLYPH[a.body_a] && GLYPH[a.body_b] && pl[a.body_a] && pl[a.body_b] && a.aspect_type !== 'conjunction' && a.aspect_type !== 'quincunx').forEach(a => {
    const [x1, y1] = pt(Number(pl[a.body_a].longitude), R4), [x2, y2] = pt(Number(pl[a.body_b].longitude), R4);
    const soft = a.aspect_type === 'trine' || a.aspect_type === 'sextile';
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${soft ? gold : ink}" stroke-width="${soft ? 0.9 : 1.1}" ${soft ? 'stroke-dasharray="5 4"' : ''} opacity="0.9"/>`;
  });
  // bodies, spread to avoid overlap
  const bodies = Object.keys(GLYPH).filter(b => pl[b]).map(b => ({ b, L: Number(pl[b].longitude), d: Number(pl[b].longitude) })).sort((a, b) => a.L - b.L);
  for (let pass = 0; pass < 6; pass++) for (let i = 0; i < bodies.length; i++) { const a = bodies[i], b = bodies[(i + 1) % bodies.length]; let gap = ((b.d - a.d) + 360) % 360; if (bodies.length > 1 && gap < 7) { const push = (7 - gap) / 2; a.d -= push; b.d += push; } }
  bodies.forEach(({ b, L, d }) => {
    const [x, y] = pt(d, (R3 + R4) / 2 + 18), [tx, ty] = pt(L, R3), [tx2, ty2] = pt(L, R3 - 7);
    s += `<line x1="${tx}" y1="${ty}" x2="${tx2}" y2="${ty2}" stroke="${ink}" stroke-width="1.2"/>`;
    s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="21" fill="${ink}" ${sym}>${GLYPH[b]}&#xFE0E;</text>`;
    const deg = Math.floor(Number(pl[b].zodiac_degree) || (L % 30)), [dx, dy] = pt(d, (R3 + R4) / 2 - 8);
    s += `<text x="${dx}" y="${dy}" text-anchor="middle" dominant-baseline="central" font-size="11" font-family="Jost, Arial, sans-serif" fill="${dim}">${deg}°${pl[b].retrograde ? 'r' : ''}</text>`;
  });
  return s + `</svg>`;
}
async function wheelPNG() {

  const cv = document.createElement('canvas'); cv.width = 1200; cv.height = 1200;

  const c2 = cv.getContext('2d'); return cv.toDataURL('image/jpeg', 0.9);
}
