<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Chart · Navigation Map</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* readability-standard.md v3 — walnut frame, vellum reading surface. Floor: 15px, opacity 0.88. */
:root {
  --bg: #1c1812; --surface: #251f18; --surface-2: #2e261e;
  --text: #f0e6cc; --text-secondary: #d4c7a8; --text-dim: #b8a98a;
  --gold: #b08030; --gold-bright: #c9a04a; --gold-dim: rgba(176,128,48,0.72);
  --border: rgba(176,128,48,0.18);
  --vellum: #e8dcbb; --vellum-dark: #ddd0a8; --vellum-deeper: #d3c599;
  --ink: #14110a; --ink-secondary: #2b2414; --ink-dim: #4e4228; --ink-gold: #7a5618;
  --mythic: #3d2f70; --conceptual: #165a42; --somatic: #7a3216;
  --text-body: 1.15rem; --text-body-sm: 1.05rem; --text-label: 0.94rem;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Cormorant Garamond', Georgia, serif; font-size: 16px; line-height: 1.6; min-height: 100vh; }
.frame { max-width: 920px; margin: 0 auto; padding: 2.5rem 1rem 5rem; }
.topbar { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
.eyebrow { font-family: 'Jost', sans-serif; font-size: var(--text-label); font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold-bright); }
.btn { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; padding: 0.6rem 1.1rem; border-radius: 3px; border: 1px solid var(--gold); background: transparent; color: var(--gold-bright); cursor: pointer; text-decoration: none; display: inline-block; }
.btn:hover { background: rgba(176,128,48,0.12); }
.btn-solid { background: var(--gold); color: #1c1812; }
.btn-solid:hover { background: var(--gold-bright); }
.btn[disabled] { opacity: 0.88; cursor: wait; }
.msg { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 2rem; font-size: var(--text-body); color: var(--text-secondary); }

/* admin bar (dark frame) */
.adminbar { background: var(--surface); border: 1px solid var(--gold-dim); border-radius: 4px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; font-family: 'Jost', sans-serif; font-size: 15px; color: var(--text-secondary); display: flex; flex-wrap: wrap; gap: 0.75rem 1.5rem; align-items: center; }
.adminbar b { color: var(--text); font-weight: 500; }
.adminbar label { display: inline-flex; gap: 0.45rem; align-items: center; cursor: pointer; }
.adminbar .status { color: var(--gold-bright); }
.draftnote { width: 100%; color: var(--text-dim); }

/* vellum reading surface */
.sheet { background: var(--vellum); color: var(--ink); border-radius: 4px; padding: 3rem 3.25rem 3.5rem; position: relative; }
.sheet::before { content: ''; position: absolute; top: 0; left: 8%; right: 8%; height: 1px; background: linear-gradient(90deg, transparent, var(--gold) 30%, var(--gold) 70%, transparent); opacity: 0.6; }
.title { font-size: 2.6rem; font-weight: 500; line-height: 1.15; color: var(--ink); margin: 0.4rem 0 0.4rem; }
.subtitle { font-style: italic; font-size: var(--text-body); color: var(--ink-dim); }
.sheet .eyebrow { color: var(--ink-gold); }
section.part { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid rgba(122,86,24,0.35); }
h2 { font-size: 1.95rem; font-weight: 500; color: var(--ink); line-height: 1.2; margin-bottom: 0.9rem; }
h3 { font-size: 1.4rem; font-weight: 600; color: var(--ink); line-height: 1.25; margin: 1.6rem 0 0.35rem; }
h4 { font-family: 'Jost', sans-serif; font-size: var(--text-label); font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-gold); margin: 1.5rem 0 0.4rem; }
p.t { font-size: var(--text-body); font-weight: 400; color: var(--ink-secondary); margin-bottom: 0.85rem; }
p.lead { font-size: 1.22rem; color: var(--ink); }
.meta { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500; color: var(--ink-dim); letter-spacing: 0.03em; margin-bottom: 0.5rem; }
.stage { font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-gold); margin-right: 0.4rem; }
.group { margin: 1.4rem 0 1.8rem; padding-left: 1.1rem; border-left: 2px solid rgba(122,86,24,0.45); }
.group.gk { padding-left: 1.25rem; }
.wheel { display: block; width: 100%; max-width: 560px; margin: 1.5rem auto 0.5rem; }
.bars { margin: 0.6rem 0 1rem; }
.bar { display: grid; grid-template-columns: 9.5rem 1fr 3.5rem; gap: 0.75rem; align-items: center; font-family: 'Jost', sans-serif; font-size: 15px; color: var(--ink-secondary); margin: 0.3rem 0; }
.bar .track { height: 8px; border: 1px solid var(--ink-dim); border-radius: 4px; overflow: hidden; }
.bar .fill { height: 100%; background: var(--ink-gold); }
.hidden-note { font-family: 'Jost', sans-serif; font-size: 15px; color: var(--ink-dim); font-style: italic; }

/* edit controls (admin only) */
.ed { position: relative; }
.ed .pen { display: none; font-family: 'Jost', sans-serif; font-size: 15px; color: var(--ink-gold); background: var(--vellum-dark); border: 1px solid var(--ink-gold); border-radius: 3px; padding: 0.05rem 0.5rem; margin-left: 0.4rem; cursor: pointer; vertical-align: middle; }
body.editing .ed .pen { display: inline-block; }
.ed.overridden { box-shadow: -6px 0 0 -3px var(--somatic); }
.editor { background: var(--vellum-dark); border: 1px solid var(--ink-gold); border-radius: 4px; padding: 0.9rem; margin: 0.4rem 0 1rem; }
.editor textarea { width: 100%; min-height: 8rem; font-family: 'Cormorant Garamond', Georgia, serif; font-size: var(--text-body); color: var(--ink); background: #f3ead2; border: 1px solid var(--ink-dim); border-radius: 3px; padding: 0.6rem; line-height: 1.5; }
.editor .row { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.6rem; align-items: center; }
.editor .btn { color: var(--ink); border-color: var(--ink-gold); font-size: 15px; padding: 0.4rem 0.8rem; }
.editor .btn-solid { background: var(--ink-gold); color: var(--vellum); }
.editor .why { font-family: 'Jost', sans-serif; font-size: 15px; color: var(--ink-dim); width: 100%; }

@media (max-width: 640px) {
  .sheet { padding: 2rem 1.25rem 2.5rem; }
  .title { font-size: 2rem; }
  .bar { grid-template-columns: 6.5rem 1fr 3rem; }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
</head>

<script>
const SUPABASE_URL = 'https://egldaiqrwuxqgavjwwim.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbGRhaXFyd3V4cWdhdmp3d2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzkxMTMsImV4cCI6MjA5MTQxNTExM30.jVZvPEPP4f78OfbaWBAryGPd4N_b16FKY92NXi-CeeA';
const ADMIN_EMAIL = 'christypaxtonwade@gmail.com';

// ── Session (shared with the portal via storage — same shape as chart-admin.html) ──
function readPortalSession() {
  for (const store of [sessionStorage, localStorage]) {
    try { const raw = store.getItem('portal_session'); if (!raw) continue; const s = JSON.parse(raw); if (s?.access_token) return s; } catch {}
  }
  return null;
}
function writePortalSession(s) { const p = JSON.stringify(s); try { sessionStorage.setItem('portal_session', p); } catch {} try { localStorage.setItem('portal_session', p); } catch {} }
let _refresh = null;
async function token() {
  const s = readPortalSession(); if (!s) return null;
  const now = Date.now(), expired = s.expires_at && now > s.expires_at;
  if (s.expires_at && now < s.expires_at - 60000) return s.access_token;
  if (!s.refresh_token) return expired ? null : s.access_token;
  if (!_refresh) _refresh = (async () => {
    try {
      const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) });
      const d = await r.json(); if (!r.ok || !d.access_token) return null;
      const f = { access_token: d.access_token, refresh_token: d.refresh_token || s.refresh_token, expires_at: Date.now() + (d.expires_in || 3600) * 1000, user: d.user || s.user };
      writePortalSession(f); return f.access_token;
    } catch { return null; } finally { _refresh = null; }
  })();
  return _refresh;
}
async function api(path, opts = {}) {
  const t = await token(); if (!t) throw new Error('SESSION_EXPIRED');
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { ...opts, headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${t}`, 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (res.status === 401) throw new Error('SESSION_EXPIRED');
  if (!res.ok) throw new Error(`${res.status}: ${await res.text()}`);
  return res.status === 204 || opts.method === 'DELETE' || (opts.headers && opts.headers.Prefer === 'return=minimal') ? null : res.json();
}
const get = (p) => api(p).catch(e => { if (e.message === 'SESSION_EXPIRED') throw e; console.warn(p, e); return []; });

// ── Utilities ──
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const md = s => esc(s).replace(/\*([^*]+)\*/g, '<i>$1</i>');           // *Subterrain* → italic
const plain = s => String(s ?? '').replace(/\*([^*]+)\*/g, '$1');
const cap = s => String(s || '').replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII'];
const ORD = n => n + ({ 1: 'st', 2: 'nd', 3: 'rd' }[(n % 100 > 10 && n % 100 < 14) ? 0 : n % 10] || 'th');
function fmtDate(d) { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d || '')); if (!m) return d || ''; return new Date(+m[1], +m[2] - 1, +m[3]).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }); }
function fmtTime(t) { const m = String(t || '').match(/^(\d{1,2}):(\d{2})/); if (!m) return ''; let h = +m[1]; const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12; return `${h}:${m[2]} ${ap}`; }

const BODY_ORDER = ['sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto','ascendant','midheaven','imum_coeli','north_node','south_node','chiron','lilith','ceres','pallas_athena','juno','vesta','astraea','hygeia','eris','haumea','sedna','nessus','chariklo'];
const BODY_GROUPS = [
  ['The Lights and Planets', ['sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto']],
  ['The Angles and Nodes', ['ascendant','midheaven','imum_coeli','north_node','south_node']],
  ['Chiron, Lilith and the Minor Bodies', ['chiron','lilith','ceres','pallas_athena','juno','vesta','astraea','hygeia','eris','haumea','sedna','nessus','chariklo']],
];
const ASPECT_BODIES = new Set(['sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto','ascendant','midheaven','chiron','north_node']);
const ELEMENTS = { aries:'Fire', leo:'Fire', sagittarius:'Fire', taurus:'Earth', virgo:'Earth', capricorn:'Earth', gemini:'Air', libra:'Air', aquarius:'Air', cancer:'Water', scorpio:'Water', pisces:'Water' };
const MODES = { aries:'Cardinal', cancer:'Cardinal', libra:'Cardinal', capricorn:'Cardinal', taurus:'Fixed', leo:'Fixed', scorpio:'Fixed', aquarius:'Fixed', gemini:'Mutable', virgo:'Mutable', sagittarius:'Mutable', pisces:'Mutable' };
const BALANCE = ['sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto','ascendant','midheaven','chiron'];
const SEQUENCES = [
  ['gk_activation', [['lifes_work', true], ['evolution'], ['radiance'], ['purpose']]],
  ['gk_venus', [['attraction'], ['iq'], ['eq'], ['sq'], ['core', true]]],
  ['gk_pearl', [['vocation'], ['culture'], ['brand'], ['pearl', true]]],
];

// ── State ──
const params = new URLSearchParams(location.search);
const S = { isAdmin: false, editing: false, preview: params.get('preview') === '1', clientId: null, D: null };

async function init() {
  const root = document.getElementById('root');
  const sess = readPortalSession();
  if (!sess) { root.innerHTML = `<div class="msg">Please sign in to your portal first, then open your chart from there. <br><br><a class="btn" href="portal.html">Go to the portal</a></div>`; return; }
  S.isAdmin = (sess.user?.email || '').toLowerCase() === ADMIN_EMAIL && !S.preview;
  try {
    if (params.get('client_id')) S.clientId = params.get('client_id');
    else if (!S.isAdmin && sess.user?.id) { const [me] = await get(`clients?auth_user_id=eq.${sess.user.id}&select=id&limit=1`); S.clientId = me?.id; }
    if (!S.clientId) { root.innerHTML = `<div class="msg">${S.isAdmin ? 'Open this page from a client in the portal (it needs ?client_id=…).' : 'We could not find your client record. Please return to the portal.'}</div>`; return; }
    await load();
    render();
  } catch (e) {
    root.innerHTML = `<div class="msg">${e.message === 'SESSION_EXPIRED' ? 'Your session has expired. Please sign in to the portal again, then reopen your chart.' : 'Something went wrong loading the chart: ' + esc(e.message)}</div>`;
  }
}

async function load() {
  const id = S.clientId;
  const [client] = await get(`clients?id=eq.${id}&select=id,name,pronouns,access_chart&limit=1`);
  if (!client) throw new Error('Client not found');
  const q = {
    birth: get(`chart_birth_data?client_id=eq.${id}&limit=1`),
    planets: get(`chart_planets?client_id=eq.${id}&side=eq.personality&select=body,longitude,zodiac_sign,zodiac_degree,house,retrograde`),
    astro: get(`chart_astrology?client_id=eq.${id}&limit=1`),
    aspects: get(`chart_aspects?client_id=eq.${id}&select=body_a,body_b,aspect_type,orb,applying&order=orb.asc`),
    hd: get(`chart_human_design?client_id=eq.${id}&limit=1`),
    gk: get(`chart_gene_keys?client_id=eq.${id}&limit=1`),
    gkRef: get(`gene_keys_reference?select=number,shadow,gift,siddhi,theme,primary_field_id,shadow_field_id,gift_field_id,siddhi_field_id`),
    gkDesc: get(`gene_keys_descriptions?select=number,shadow_desc,gift_desc,siddhi_desc,status`),
    gkSubs: get(`gene_keys_subterrains?select=gene_key_number,subterrain_id,level,weight`),
    fields: get(`fields?select=id,number,name,tagline,arc&order=number`),
    subs: get(`subterrains?select=id,name,field_id,description`),
    signFields: get(`sign_field_activations?select=sign_name,field_id,is_secondary`),
    houseFields: get(`house_field_activations?select=house_number,field_id,is_secondary`),
    astSubs: get(`asteroid_subterrain_archetypes?select=body_name,subterrain_id,field_id,is_secondary`),
    weights: get(`chart_body_weights?select=body_name,body_weight`),
    channels: get(`hd_channels_reference?select=gate_a,gate_b,name,quality`),
    ref: get(`chart_reference_text?select=kind,key,title,body`),
    over: get(`client_chart_text?client_id=eq.${id}&select=section_key,body`),
  };
  const D = { client };
  for (const [k, p] of Object.entries(q)) D[k] = await p;
  D.birth = D.birth[0] || null; D.astro = D.astro[0] || null; D.hd = D.hd[0] || null; D.gk = D.gk[0] || null;
  D.fieldById = Object.fromEntries(D.fields.map(f => [f.id, f]));
  D.subById = Object.fromEntries(D.subs.map(s => [s.id, s]));
  D.gkByNum = Object.fromEntries(D.gkRef.map(g => [g.number, g]));
  D.gkDesc.forEach(x => { if (D.gkByNum[x.number]) Object.assign(D.gkByNum[x.number], x); });
  D.REF = {}; D.ref.forEach(r => { (D.REF[r.kind] = D.REF[r.kind] || {})[r.key] = r; });
  D.OVER = Object.fromEntries(D.over.map(o => [o.section_key, o.body]));
  D.weightOf = Object.fromEntries(D.weights.map(w => [w.body_name, Number(w.body_weight) || 0.5]));
  S.D = D;
}

// ── Text resolution ──
// Every editable block has a key. A per-client override (client_chart_text) wins over
// the default; an empty override hides the block for this client. `src` names the
// reference row the default came from, so an admin can also save to the reference.
function ref(kind, key) { return S.D.REF[kind]?.[key] || null; }
function refBody(kind, key) { return ref(kind, key)?.body || ''; }
function refTitle(kind, key, fb) { return ref(kind, key)?.title || fb; }
function block(key, def, src, cls = 't') {
  const has = Object.prototype.hasOwnProperty.call(S.D.OVER, key);
  const text = has ? S.D.OVER[key] : def;
  return { t: 'p', key, text, def, src, cls, overridden: has, hidden: has && !text.trim() };
}

// ── Model ──
// The page and the PDF render from the same list of nodes.
function buildModel() {
  const D = S.D, M = [];
  const name = D.client.name || 'Client';
  const b = D.birth;
  const birthLine = b ? [fmtDate(b.birth_date), fmtTime(b.birth_time), b.birth_place].filter(Boolean).join(' · ') : '';
  M.push({ t: 'title', text: name, sub: birthLine });
  M.push(block('section:intro', refBody('section', 'intro'), { kind: 'section', key: 'intro' }, 't lead'));
  M.push(block('section:how_to_read', refBody('section', 'how_to_read'), { kind: 'section', key: 'how_to_read' }));

  // Map activations per body
  const s2f = {}, h2f = {}, b2s = {};
  D.signFields.forEach(x => (s2f[x.sign_name] = s2f[x.sign_name] || []).push(x));
  D.houseFields.forEach(x => (h2f[x.house_number] = h2f[x.house_number] || []).push(x));
  D.astSubs.forEach(x => (b2s[x.body_name] = b2s[x.body_name] || []).push(x));
  const byBody = Object.fromEntries(D.planets.map(p => [p.body, p]));
  const fieldScore = {}, fieldSources = {}, subHits = {};
  const credit = (fid, w, label) => { if (!fid || !D.fieldById[fid]) return; fieldScore[fid] = (fieldScore[fid] || 0) + w; (fieldSources[fid] = fieldSources[fid] || new Set()).add(label); };
  const creditSub = (sid, label) => { if (!D.subById[sid]) return; (subHits[sid] = subHits[sid] || new Set()).add(label); };
  const fieldsFor = p => {
    const seen = new Map();
    [...(s2f[p.zodiac_sign] || []), ...(h2f[p.house] || [])].forEach(x => { const f = D.fieldById[x.field_id]; if (f && !seen.has(f.id)) seen.set(f.id, { f, sec: x.is_secondary }); });
    return [...seen.values()];
  };

  // ── The Sky
  if (D.planets.length) {
    M.push({ t: 'h2', text: refTitle('section', 'sky', 'The Sky at Your Birth') });
    M.push(block('section:sky', refBody('section', 'sky'), { kind: 'section', key: 'sky' }));
    M.push({ t: 'wheel' });
    for (const [gname, bodies] of BODY_GROUPS) {
      const present = bodies.filter(x => byBody[x]);
      if (!present.length) continue;
      M.push({ t: 'h4', text: gname });
      for (const body of present) {
        const p = byBody[body];
        const title = refTitle('body', body, cap(body));
        const deg = p.zodiac_degree != null ? Math.floor(Number(p.zodiac_degree)) + '°' : '';
        const sign = cap(p.zodiac_sign);
        const pos = [deg && sign ? `${deg} ${sign}` : sign, p.house ? `${ORD(p.house)} house` : '', p.retrograde ? 'retrograde' : ''].filter(Boolean).join(' · ');
        const fl = fieldsFor(p);
        const w = D.weightOf[body] ?? 0.5;
        fl.forEach(x => credit(x.f.id, x.sec ? w * 0.5 : w, title));
        const subs = (b2s[body] || []).map(x => D.subById[x.subterrain_id]).filter(Boolean);
        subs.forEach(s => { creditSub(s.id, title); credit(s.field_id, w * 0.5, title); });
        const mapLine = [fl.length ? 'On the Map: ' + fl.map(x => `Field ${ROMAN[x.f.number]} · ${x.f.name}`).join('; ') : '', subs.length ? 'Subterrain: ' + subs.map(s => s.name).join(', ') : ''].filter(Boolean).join(' — ');
        const signTxt = refBody('sign', p.zodiac_sign), houseTxt = refBody('house', String(p.house));
        const def = [refBody('body', body),
          signTxt ? `In ${sign}, it is ${signTxt}` : '',
          houseTxt ? `In the ${ORD(p.house)} house, it does its work in ${houseTxt}.` : ''].filter(Boolean).join(' ');
        M.push({ t: 'group', children: [
          { t: 'h3', text: `${title}` }, { t: 'meta', text: pos }, ...(mapLine ? [{ t: 'meta', text: mapLine }] : []),
          block(`place:${body}`, def, null),
        ] });
      }
    }

    // Aspects
    const asp = D.aspects.filter(a => ASPECT_BODIES.has(a.body_a) && ASPECT_BODIES.has(a.body_b)).slice(0, 12);
    if (asp.length) {
      M.push({ t: 'h2', text: refTitle('section', 'aspects', 'Conversations Between Planets') });
      M.push(block('section:aspects', refBody('section', 'aspects'), { kind: 'section', key: 'aspects' }));
      asp.forEach(a => {
        const A = refTitle('body', a.body_a, cap(a.body_a)), B = refTitle('body', a.body_b, cap(a.body_b));
        const kind = refTitle('aspect', a.aspect_type, cap(a.aspect_type));

// ── Chart wheel (SVG) ──

  D.aspects.filter(a => GLYPH[a.body_a] && GLYPH[a.body_b] && pl[a.body_a] && pl[a.body_b] && a.aspect_type !== 'conjunction' && a.aspect_type !== 'quincunx').forEach(a => {

  });
  // bodies, spread to avoid overlap
  const bodies = Object.keys(GLYPH).filter(b => pl[b]).map(b => ({ b, L: Number(pl[b].longitude), d: Number(pl[b].longitude) })).sort((a, b) => a.L - b.L);
  for (let pass = 0; pass < 6; pass++) for (let i = 0; i < bodies.length; i++) { const a = bodies[i], b = bodies[(i + 1) % bodies.length]; let gap = ((b.d - a.d) + 360) % 360; if (bodies.length > 1 && gap < 7) { const push = (7 - gap) / 2; a.d -= push; b.d += push; } }

    s += `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-size="21" fill="${ink}" ${sym}>${GLYPH[b]}&#xFE0E;</text>`;
    const deg = Math.floor(Number(pl[b].zodiac_degree) || (L % 30)), [dx, dy] = pt(d, (R3 + R4) / 2 - 8);

}
async function wheelPNG() {
  const svg = wheelSVG(true);
  const img = new Image(); const url = URL.createObjectURL(new Blob([svg], { type: 'image/svg+xml' }));
  await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
  const cv = document.createElement('canvas'); cv.width = 1200; cv.height = 1200;
  cv.getContext('2d').drawImage(img, 0, 0, 1200, 1200); URL.revokeObjectURL(url);
  const c2 = cv.getContext('2d'); return cv.toDataURL('image/jpeg', 0.9);
}

// ── PDF (from the same model; white page, ink text, no fills — prints cleanly in black and white) ──
function pdfText(s) {
  return plain(s).replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, m => m === '—' ? ' - ' : '-').replace(/→/g, '>').replace(/…/g, '...').replace(/°/g, '°').replace(/[^\x00-\xFF]/g, '');
}
async function downloadPdf(btn) {
  const JS = window.jspdf && window.jspdf.jsPDF; if (!JS) { alert('The PDF tool is still loading. Try again in a moment.'); return; }
  btn.disabled = true; btn.textContent = 'Preparing…';
  try {
    const doc = new JS({ unit: 'pt', format: 'letter' });
    const W = doc.internal.pageSize.getWidth(), H = doc.internal.pageSize.getHeight(), M = 64, maxW = W - 2 * M;
    const INK = [20, 17, 10], DIM = [62, 52, 32], GOLD = [90, 63, 16];
    let y = M, page = 1;
    const name = S.D.client.name || 'Client';
    const footer = () => { doc.setFont('times', 'normal'); doc.setFontSize(10.5); doc.setTextColor(...DIM); doc.text(pdfText(`${name} · Chart Analysis · ${page}`), W / 2, H - 34, { align: 'center' }); };
    const newPage = () => { footer(); doc.addPage(); page++; y = M; };
    const need = h => { if (y + h > H - M) newPage(); };
    const write = (text, { size = 12.5, font = 'normal', color = INK, lead = 1.42, after = 8, indent = 0, family = 'times', keep = 0 } = {}) => {
      doc.setFont(family, font); doc.setFontSize(size); doc.setTextColor(...color);
      const lines = doc.splitTextToSize(pdfText(text), maxW - indent);
      const lh = size * lead;
      need(Math.min(lines.length, 3) * lh + keep);
      lines.forEach(l => { need(lh); doc.text(l, M + indent, y + size); y += lh; });
      y += after;
    };
    const rule = () => { need(14); doc.setDrawColor(...GOLD); doc.setLineWidth(0.6); doc.line(M, y, W - M, y); y += 14; };
    let ind = 0;
    const walk = async (n) => {
      switch (n.t) {
        case 'title':
          y = H * 0.32;
          write('NAVIGATION MAP · CHART ANALYSIS', { size: 11, family: 'helvetica', color: GOLD, after: 14 });
          write(n.text, { size: 32, after: 8, lead: 1.2 });
          if (n.sub) write(n.sub, { size: 13, font: 'italic', color: DIM, after: 18 });
          rule(); newPage(); break;
        case 'h2': if (y > M + 4) newPage(); write(n.text, { size: 22, after: 6, lead: 1.2 }); rule(); break;
        case 'h2b': need(120); y += 10; write(n.text, { size: 18, after: 6, lead: 1.2, keep: 80 }); break;
        case 'h3': y += 6; write(n.text, { size: 14.5, font: 'bold', after: 3, indent: ind, keep: 95 }); break;
        case 'h4': y += 6; write(n.text.toUpperCase(), { size: 10.5, family: 'helvetica', font: 'bold', color: GOLD, after: 4, indent: ind, keep: 120 }); break;
        case 'eyebrow': write(n.text.toUpperCase(), { size: 10.5, family: 'helvetica', font: 'bold', color: GOLD, after: 2, indent: ind, keep: 60 }); break;
        case 'meta': write(n.text, { size: 11, family: 'helvetica', color: DIM, after: 4, indent: ind }); break;
        case 'wheel': { const png = await wheelPNG(); const sz = Math.min(maxW, 400); need(sz + 10); doc.addImage(png, 'JPEG', (W - sz) / 2, y, sz, sz); y += sz + 14; break; }
        case 'bars': n.rows.forEach(r => { need(18); doc.setFont('helvetica', 'normal'); doc.setFontSize(11); doc.setTextColor(...INK); doc.text(pdfText(r.label), M, y + 11); const bx = M + (n.wide ? 200 : 110), bw = maxW - (n.wide ? 200 : 160); doc.setDrawColor(...DIM); doc.setLineWidth(0.6); doc.rect(bx, y + 3, bw, 8); doc.setFillColor(...INK); doc.rect(bx, y + 3, bw * r.pct / 100, 8, 'F'); if (!n.wide) doc.text(String(r.v), W - M, y + 11, { align: 'right' }); y += 18; }); y += 8; break;
        case 'group': y += 4; ind = 12; for (const c of n.children) await walk(c); ind = 0; y += 6; break;
        case 'p':
          if (n.hidden || !n.text) break;
          if (n.stage) { y += 4; write(n.stage.toUpperCase() + (n.stageMeta ? '   ' + n.stageMeta : ''), { size: 10.5, family: 'helvetica', font: 'bold', color: GOLD, after: 3, indent: ind, keep: 50 }); }
          write(n.text, { size: n.cls.includes('lead') ? 13.5 : 12.5, indent: ind });
          break;
      }
    };
    for (const n of S.model) await walk(n);
    footer();
    doc.save(`chart-analysis-${(name).toLowerCase().replace(/[^a-z0-9]+/g, '-')}.pdf`);
  } catch (e) { alert('PDF failed: ' + e.message); }
  btn.disabled = false; btn.textContent = 'Download PDF';
}
