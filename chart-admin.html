<style>
/* ── readability-standard.md — warm walnut frame + vellum reading surfaces ── */
:root {
  --bg: #1c1812;
  --surface: #251f18;
  --surface-2: #2e261e;
  --text: #f0e6cc;
  --text-secondary: #d4c7a8;
  --text-dim: #b8a98a;
  --text-faint: #8f826a;
  --gold: #b08030;
  --gold-bright: #c9a04a;
  --gold-dim: rgba(176,128,48,0.72);
  --border: rgba(176,128,48,0.18);
  --accent: rgba(176,128,48,0.08);
  /* vellum / ink for reading surfaces */
  --vellum: #e8dcbb;
  --vellum-deeper: #d3c599;
  --ink: #14110a;
  --ink-secondary: #2b2414;
  --ink-dim: #4e4228;
  --ink-faint: #78694a;
  --ink-gold: #7a5618;
  --ink-gold-bright: #a07428;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: 'Cormorant Garamond', Georgia, serif;
  font-size: 16px; line-height: 1.55;
  min-height: 100vh;
}
.page { max-width: 1200px; margin: 0 auto; padding: 3rem 2.5rem 6rem; }

/* ── Header ── */
.header { margin-bottom: 2.5rem; padding-bottom: 2rem; border-bottom: 1px solid var(--border); }
.eyebrow {
  font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 0.75rem;
}
.client-name {
  font-size: 2.25rem; font-weight: 500; color: var(--text);
  letter-spacing: -0.01em; margin-bottom: 0.5rem;
}
.birth-line {
  font-size: 16px; color: var(--text-dim); font-style: italic;
}
.header-actions { margin-top: 1.25rem; display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap; }
.btn {
  font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--gold); background: none;
  border: 1px solid var(--gold-dim); border-radius: 6px;
  padding: 9px 18px; cursor: pointer; transition: all 0.2s;
  text-decoration: none; display: inline-block;
}
.btn:hover { border-color: var(--gold); background: var(--accent); color: var(--gold-bright); }
.btn-back { color: var(--text-dim); border-color: var(--border); }
.btn-back:hover { color: var(--text); border-color: var(--gold-dim); }
.last-computed {
  font-family: 'Jost', sans-serif; font-size: 15px; color: var(--text-faint);
  letter-spacing: 0.05em;
}

/* ── Sections ── */
.section { margin-top: 3rem; }
.section-title {
  font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500;
  letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 0.6rem;
  padding-bottom: 0.5rem; border-bottom: 1px solid var(--border);
}
.section-intro {
  font-size: 16px; color: var(--text-secondary); line-height: 1.55;
  margin-bottom: 1.25rem; max-width: 820px;
}

/* ── Birth data form ── */
.birth-form {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  padding: 1.5rem; display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem;
}
.field { display: flex; flex-direction: column; gap: 0.35rem; position: relative; }
.field.span-2 { grid-column: span 2; }
.field-label {

}
.field-input, .field-select {

.field-select { cursor: pointer; }
.field-select option { background: var(--surface); color: var(--text); }
.field-input:focus, .field-select:focus { border-color: var(--gold-dim); }

.coord-toggle {

}
.coord-toggle:hover { color: var(--gold); }
.coord-fields { display: none; grid-column: 1 / -1; gap: 1rem;

.form-actions {

  font-family: 'Jost', sans-serif; font-size: 15px; color: var(--text-dim);

/* ── City autocomplete dropdown ── */

.autocomplete-list {
  position: absolute; top: 100%; left: 0; right: 0; z-index: 50;
  background: var(--surface); border: 1px solid var(--gold-dim);

}
.autocomplete-list.show { display: block; }
.autocomplete-item {
  padding: 10px 12px; cursor: pointer;
  font-family: 'Jost', sans-serif; font-size: 15px; color: var(--text-secondary);
  border-bottom: 1px solid var(--border);
  line-height: 1.35;
}
.autocomplete-item:hover, .autocomplete-item.active {

.autocomplete-item:last-child { border-bottom: none; }
.autocomplete-item .ac-coords {

.autocomplete-loading {
  padding: 10px 12px; font-family: 'Jost', sans-serif; font-size: 15px;

/* ── HD Bodygraph block ── */
.hd-block {
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;

}
.hd-cell { display: flex; flex-direction: column; gap: 0.3rem; }
.hd-label {
  font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500;

/* ── Sequence cards (vellum surface, ink type) ── */

.seq-card {

}
.seq-card.core { border-color: var(--ink-gold); border-width: 2px; }
.seq-sphere {

}

}
.seq-arc {

}
.seq-field {

/* ── Astrology placements + Map-activations table ── */
.astro-tier-h {
  font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 600;

}
.astro-table { width: 100%; border-collapse: collapse; margin-bottom: 0.5rem; }
.astro-table th {
  font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500;
  letter-spacing: 0.05em; text-transform: uppercase; color: var(--text-dim);

}

/* ── Chart Analysis · emphasis bars ── */
.analysis-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
.analysis-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1.1rem 1.25rem; }

.cq-block { margin-top: 0.9rem; }

/* ── Planet positions table ── */
.planets-table {

/* ── Lineage resonance matches ── */

}
.match-group { margin-bottom: 1.5rem; }
.match-group-header {
  font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 500;

}
.match-group-arc {

.match-strength.dominant { background: rgba(176,128,48,0.18); color: var(--gold-bright); }

/* ── Private notes ── */

<div class="page" id="page">

</div>

<script>
const SUPABASE_URL = 'https://egldaiqrwuxqgavjwwim.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVnbGRhaXFyd3V4cWdhdmp3d2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4MzkxMTMsImV4cCI6MjA5MTQxNTExM30.jVZvPEPP4f78OfbaWBAryGPd4N_b16FKY92NXi-CeeA';

// ── Auth helpers (mirrors convergence.html — same portal session shape) ──
function readPortalSession() {
  for (const store of [sessionStorage, localStorage]) {
    try {
      const raw = store.getItem('portal_session');
      if (!raw) continue;
      const session = JSON.parse(raw);
      if (session?.access_token) return { session, store };
    } catch {}
  }
  return { session: null, store: null };
}
function writePortalSession(session) {
  const payload = JSON.stringify(session);
  try { sessionStorage.setItem('portal_session', payload); } catch {}
  try { localStorage.setItem('portal_session', payload); } catch {}
}
let _refreshInflight = null;
async function getFreshAccessToken() {
  const { session } = readPortalSession();
  if (!session) return null;
  const now = Date.now();
  const needsRefresh = !session.expires_at || (now > session.expires_at - 60_000);
  if (!needsRefresh) return session.access_token;
  if (!session.refresh_token) return session.access_token;
  if (!_refreshInflight) {
    _refreshInflight = (async () => {
      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: session.refresh_token })
        });
        const data = await res.json();
        if (!res.ok || !data.access_token) return null;
        const fresh = {
          access_token: data.access_token,
          refresh_token: data.refresh_token || session.refresh_token,
          expires_at: Date.now() + ((data.expires_in || 3600) * 1000),
          user: data.user || session.user
        };
        writePortalSession(fresh);
        return fresh.access_token;
      } catch { return null; }
      finally { _refreshInflight = null; }
    })();
  }
  return await _refreshInflight;
}

// ── Supabase REST helpers ──
// These run against RLS-protected admin tables (clients, chart_*), so they must
// carry the signed-in admin's JWT — NOT the anon key. The portal session is
// shared via localStorage, so a tab opened from the portal inherits it.
// (Using the anon key here was the "Client not found" bug: anon can't read clients.)
async function sb(path) {
  const token = (await getFreshAccessToken()) || SUPABASE_KEY;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    headers: { 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token}` }
  });
  if (!res.ok) throw new Error(`Supabase ${res.status}: ${await res.text()}`);
  return res.json();
}
async function sbPatch(table, idCol, idVal, body) {
  const token = (await getFreshAccessToken()) || SUPABASE_KEY;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${table}?${idCol}=eq.${idVal}`, {
    method: 'PATCH',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json',
      'Prefer': 'return=minimal'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Supabase PATCH ${res.status}: ${await res.text()}`);
}

// ── Page state ──
const params = new URLSearchParams(window.location.search);
const CLIENT_ID = params.get('client_id');

const SPHERE_LABELS = {
  // Activation
  lifes_work: "Life's Work",
  evolution:  'Evolution',
  radiance:   'Radiance',
  purpose:    'Purpose',
  // Venus
  attraction: 'Attraction',
  iq:         'IQ',
  eq:         'EQ',
  sq:         'SQ',
  core:       'Core Wound',
  // Pearl
  vocation:   'Vocation',
  brand:      'Brand',
  culture:    'Culture',
  pearl:      'Pearl'
};

// ── Main ──
async function init() {
  const page = document.getElementById('page');
  if (!CLIENT_ID) {
    page.innerHTML = `<div class="error-box">No client_id provided. Use ?client_id=&lt;uuid&gt; in the URL.</div>`;
    return;
  }
  // Shares the portal's login via localStorage. If there's no session in this
  // browser, say so plainly instead of failing later as "Client not found".
  if (!readPortalSession().session) {
    page.innerHTML = `<div class="error-box">Not signed in. Open this page from the portal (it shares your login), or sign in at the portal first, then reopen.</div>`;
    return;
  }
  try {
    const [client] = await sb(`clients?id=eq.${CLIENT_ID}&limit=1`);
    if (!client) throw new Error('Client not found');

    const [birth]   = await sb(`chart_birth_data?client_id=eq.${CLIENT_ID}&limit=1`);
    const [hd]      = await sb(`chart_human_design?client_id=eq.${CLIENT_ID}&limit=1`);
    const [gk]      = await sb(`chart_gene_keys?client_id=eq.${CLIENT_ID}&limit=1`);

    // GK reference for shadow/gift/siddhi/field-name lookup

// Parse YYYY-MM-DD as a LOCAL date (not UTC). Avoids the timezone-shift bug
// where new Date('1974-06-15') shows as June 14 west of UTC.
function fmtDate(d) {
  if (!d) return '—';
  try {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(d));
    if (m) {
      const dt = new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
      return dt.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
    }
    return new Date(d).toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
  } catch { return d; }
}
function fmtTime(t) { return t || '—'; }

function render({ client, birth, hd, gk, refByNum, fieldById, matches,

}

// One-click PDF of the full chart page. Clones the live, already-rendered page,
// strips interactive controls and the editable forms (.no-pdf), turns the
// synthesis textarea into static text, and downloads a branded document.
function downloadChartPdf(btn) {
  if (typeof html2pdf === 'undefined') { alert('PDF tool is still loading — try again in a moment.'); return; }
  const page = document.getElementById('page');
  if (!page) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Preparing…'; }

  const clone = page.cloneNode(true);
  // Drop editable / interactive pieces
  clone.querySelectorAll('.no-pdf, .header-actions, button, input, select, form, .form-actions, .form-status, .autocomplete-list').forEach(el => el.remove());
  // Render any textarea (e.g. the synthesis brief) as static, wrapped text
  clone.querySelectorAll('textarea').forEach(ta => {
    const div = document.createElement('div');
    div.style.cssText = 'white-space:pre-wrap;font-size:12px;line-height:1.6;color:#14110a;';
    div.textContent = ta.value || ta.textContent || '';
    ta.replaceWith(div);
  });

  const nameEl = clone.querySelector('.client-name');
  const name = (nameEl && nameEl.textContent.trim()) || 'client';
  const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');

  const holder = document.createElement('div');
  holder.style.cssText = 'width:760px;padding:40px 44px;background:#ffffff;color:#14110a;';
  // Force readable ink on a light page (the live page is dark-themed)
  holder.appendChild(clone);
  const fix = document.createElement('style');
  fix.textContent = '#pdf-holder, #pdf-holder * { color:#1c170d !important; background:transparent !important; border-color:#d8c79a !important; box-shadow:none !important; }'
    + '#pdf-holder .section-title, #pdf-holder .client-name { color:#7a5618 !important; }'
    + '#pdf-holder .section { page-break-inside:avoid; margin-bottom:18px; }'
    + '#pdf-holder table { border-collapse:collapse; width:100%; }'
    + '#pdf-holder th, #pdf-holder td { border:1px solid #d8c79a !important; padding:4px 7px; font-size:11px; }'
    + '#pdf-holder tr { page-break-inside:avoid; }';
  holder.id = 'pdf-holder';
  holder.insertBefore(fix, holder.firstChild);
  document.body.appendChild(holder);

  html2pdf().set({
    margin: [10, 0, 12, 0],
    filename: `chart-${slug || 'client'}.pdf`,
    image: { type: 'jpeg', quality: 0.97 },
    html2canvas: { scale: 2, backgroundColor: '#ffffff', windowWidth: 900 },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'avoid-all'] },
  }).from(holder).save().then(() => holder.remove()).catch(e => { holder.remove(); alert('PDF failed: ' + (e && e.message || e)); })
    .finally(() => { if (btn) { btn.disabled = false; btn.textContent = 'Download PDF'; } });
}

function renderAstrology(d) {
  const { placements, bodyWeights, signFields, houseFields, astSubs, fieldById, subById } = d;
  if (!placements || !placements.length) {
    return `<div class="section">
      <div class="section-title">Astrology · Natal Placements &amp; Map Activations</div>
      <div class="matches-empty">No chart computed yet. Save birth data above to compute the placements.</div>
    </div>`;
  }
  const wt = Object.fromEntries((bodyWeights||[]).map(b => [b.body_name, b]));
  const tierOf = body => (wt[body] ? wt[body].body_tier : 0);
  const signToFields = {};
  (signFields||[]).forEach(s => { (signToFields[s.sign_name] = signToFields[s.sign_name] || []).push({ f: fieldById[s.field_id], sec: s.is_secondary }); });
  const houseToFields = {};
  (houseFields||[]).forEach(h => { (houseToFields[h.house_number] = houseToFields[h.house_number] || []).push({ f: fieldById[h.field_id], sec: h.is_secondary }); });
  const bodyToSubs = {};
  (astSubs||[]).forEach(a => { (bodyToSubs[a.body_name] = bodyToSubs[a.body_name] || []).push({ s: subById[a.subterrain_id], sec: a.is_secondary }); });

  const groups = { 1:[], 2:[], 3:[], 0:[] };
  placements.forEach(p => { groups[tierOf(p.body)].push(p); });

  const fieldChip = (f, sec) => f ? `<span class="astro-chip${sec?' sec':''}" title="${escapeHtml(f.name)}">F${f.number} · ${escapeHtml(f.name)}</span>` : '';
  const activations = p => {
    const parts = [];
    const seen = new Set(); const fields = [];
    [...(signToFields[p.zodiac_sign]||[]), ...(houseToFields[p.house]||[])].forEach(x => {
      if (x.f && !seen.has(x.f.number)) { seen.add(x.f.number); fields.push(x); }
    });
    if (fields.length) parts.push(`<div class="astro-act-line"><span class="astro-act-lbl">Fields</span>${fields.map(x=>fieldChip(x.f,x.sec)).join('')}</div>`);
    const subs = bodyToSubs[p.body] || [];
    if (subs.length) parts.push(`<div class="astro-act-line"><span class="astro-act-lbl">Subterrains</span>${subs.map(x=>`<span class="astro-chip sub${x.sec?' sec':''}">${x.s?escapeHtml(x.s.name):'—'}</span>`).join('')}</div>`);
    return parts.join('') || '<span class="astro-muted">—</span>';
  };

  const tierBlock = tier => {
    const list = groups[tier];
    if (!list.length) return '';
    const rows = list.map(p => {
      const name = ASTRO_BODY_NAMES[p.body] || astroCap(p.body.replace(/_/g,' '));
      const sign = p.zodiac_sign ? astroCap(p.zodiac_sign) : '—';
      const deg = (p.zodiac_degree!=null && p.zodiac_degree!=='') ? Math.floor(Number(p.zodiac_degree))+'°' : '';
      const house = (p.house!=null) ? 'H'+p.house : '—';
      const retro = p.retrograde ? ' <span class="astro-retro" title="retrograde">℞</span>' : '';
      return `<tr>
        <td class="astro-body">${escapeHtml(name)}${retro}</td>
        <td class="astro-pos">${deg} ${escapeHtml(sign)} · ${house}</td>
        <td class="astro-act">${activations(p)}</td>
        <td class="astro-note">${escapeHtml(BODY_MEANINGS[p.body]||'')}</td>
      </tr>`;
    }).join('');
    return `<div class="astro-tier-h">${ASTRO_TIER_LABELS[tier]}</div>
      <table class="astro-table">
        <thead><tr><th>Body</th><th>Position</th><th>Activates on the Map</th><th>Note</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  };

  return `<div class="section">
    <div class="section-title">Astrology · Natal Placements &amp; Map Activations</div>
    <div class="section-intro">The natal chart (tropical, Placidus houses), grouped by the scoring tiers. Each body's <b>sign</b> and <b>house</b> light specific Map <b>Fields</b>; the mapped minor bodies also light specific <b>Subterrains</b>. Faded chips are secondary activations. Notes are quick-reference for what each body carries.</div>
    ${[1,2,3,0].map(tierBlock).join('')}
  </div>`;
}

function renderChartAnalysis(d) {
  const { placements, signFields, houseFields, fieldById } = d;
  if (!placements || !placements.length) return '';
  const byBody = Object.fromEntries(placements.map(p => [p.body, p]));

  const el = { Fire:0, Earth:0, Air:0, Water:0 };
  const mo = { Cardinal:0, Fixed:0, Mutable:0 };
  let counted = 0;
  BALANCE_BODIES.forEach(b => {
    const p = byBody[b];
    if (p && p.zodiac_sign) {
      const e = ASTRO_ELEMENTS[p.zodiac_sign], m = ASTRO_MODALITIES[p.zodiac_sign];
      if (e) { el[e]++; counted++; }
      if (m) mo[m]++;

  const totalMo = mo.Cardinal + mo.Fixed + mo.Mutable;

  // Field emphasis: tally Map Fields lit across all placements (sign + house).
  const s2f = {}; (signFields||[]).forEach(s => { (s2f[s.sign_name] = s2f[s.sign_name] || []).push(s.field_id); });
  const h2f = {}; (houseFields||[]).forEach(h => { (h2f[h.house_number] = h2f[h.house_number] || []).push(h.field_id); });

  const topFields = Object.entries(fieldCount).map(([id,n]) => ({ f: fieldById[id], n })).filter(x => x.f).sort((a,b) => b.n - a.n).slice(0, 5);

  const bar = (label, val, total) => {

    return `<div class="bal-row"><span class="bal-lbl">${label}</span><span class="bal-bar"><span class="bal-fill" style="width:${pct}%"></span></span><span class="bal-val">${val} · ${pct}%</span></div>`;

  return `<div class="section">
    <div class="section-title">Chart Analysis · Emphasis</div>
    <div class="section-intro">A quantitative read over the personal, social, and outer bodies (Sun–Pluto, Ascendant, Midheaven, Chiron). <b>Element</b> and <b>modality</b> show the chart's temperament; <b>Field emphasis</b> shows where the placements concentrate on the Map.</div>
    <div class="analysis-grid">
      <div class="analysis-box">
        <div class="analysis-h">Element balance</div>
        ${bar('Fire',el.Fire,counted)}${bar('Earth',el.Earth,counted)}${bar('Air',el.Air,counted)}${bar('Water',el.Water,counted)}
      </div>
      <div class="analysis-box">
        <div class="analysis-h">Modality balance</div>
        ${bar('Cardinal',mo.Cardinal,totalMo)}${bar('Fixed',mo.Fixed,totalMo)}${bar('Mutable',mo.Mutable,totalMo)}
      </div>

// ── Aspects (major geometric relationships between the core bodies) ──
const ASPECT_DEFS = [
  { name:'Conjunction', glyph:'☌', angle:0,   orb:8 },
  { name:'Opposition',  glyph:'☍', angle:180, orb:8 },
  { name:'Trine',       glyph:'△', angle:120, orb:7 },
  { name:'Square',      glyph:'□', angle:90,  orb:7 },
  { name:'Sextile',     glyph:'⚹', angle:60,  orb:5 }
];
const ASPECT_BODIES = ['sun','moon','mercury','venus','mars','jupiter','saturn','uranus','neptune','pluto','chiron','north_node','ascendant','midheaven'];

function renderAspects(d) {
  const placements = (d.placements||[]).filter(p => ASPECT_BODIES.includes(p.body) && p.longitude!=null);
  if (placements.length < 2) return '';
  const found = [];
  for (let i=0;i<placements.length;i++){
    for (let j=i+1;j<placements.length;j++){
      const a=placements[i], b=placements[j];
      let sep = Math.abs(Number(a.longitude)-Number(b.longitude)) % 360;
      if (sep>180) sep = 360-sep;
      for (const asp of ASPECT_DEFS){
        const orb = Math.abs(sep-asp.angle);
        if (orb<=asp.orb){ found.push({ a:a.body, b:b.body, asp, orb }); break; }
      }
    }
  }
  if (!found.length) return `<div class="section"><div class="section-title">Aspects</div><div class="matches-empty">No major aspects within orb among the core bodies.</div></div>`;
  found.sort((x,y)=>x.orb-y.orb);
  const nm = b => ASTRO_BODY_NAMES[b] || astroCap(b.replace(/_/g,' '));
  const rows = found.map(f => `<tr>
    <td class="astro-body">${escapeHtml(nm(f.a))}</td>
    <td class="ctr astro-aspect-glyph" title="${f.asp.name}">${f.asp.glyph}</td>
    <td class="astro-body">${escapeHtml(nm(f.b))}</td>
    <td class="astro-pos">${f.asp.name}</td>
    <td class="astro-pos num">${f.orb.toFixed(1)}°</td>
  </tr>`).join('');
  return `<div class="section">
    <div class="section-title">Aspects · ${found.length}</div>
    <div class="section-intro">The major geometric relationships among the core bodies — conjunction, opposition, trine, square, sextile — tightest first. Orbs: 8° conjunction/opposition, 7° trine/square, 5° sextile.</div>
    <table class="astro-table"><thead><tr><th>Body</th><th class="ctr">Aspect</th><th>Body</th><th>Type</th><th class="num">Orb</th></tr></thead><tbody>${rows}</tbody></table>
  </div>`;
}

async function cdGenerateSynthesis() {

  if (status) status.textContent = 'generating… (~15s)';
  try {
    const token = await getFreshAccessToken();
    const res = await fetch(`${SUPABASE_URL}/functions/v1/generate-client-synthesis`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${token || SUPABASE_KEY}` },
      body: JSON.stringify({ client_id: CLIENT_ID })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || data.details || `HTTP ${res.status}`);
    if (status) status.textContent = 'generated — refreshing…';
    setTimeout(() => location.reload(), 500);
  } catch (e) { if (status) status.textContent = 'failed: ' + e.message; }

    if (q.length < 3) { hideList(); return; }
    _acTimer = setTimeout(() => searchCity(q), 350);
  });

  document.addEventListener('click', e => {
    if (!input.contains(e.target) && !list.contains(e.target)) hideList();
  });

  function hideList() { list.classList.remove('show'); list.innerHTML = ''; }

  async function searchCity(q) {
    if (_acAbort) _acAbort.abort();
    _acAbort = new AbortController();
    list.classList.add('show');
    list.innerHTML = `<div class="autocomplete-loading">Searching…</div>`;
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q)}&format=json&limit=6&addressdetails=1&accept-language=en`;
      const res = await fetch(url, { signal: _acAbort.signal });
      if (!res.ok) throw new Error('Nominatim ' + res.status);
      const data = await res.json();
      _acResults = data;
      if (!data.length) { list.innerHTML = `<div class="autocomplete-loading">No matches.</div>`; return; }
      list.innerHTML = data.map((d, i) => `
        <div class="autocomplete-item" data-idx="${i}">
          <div>${escapeHtml(d.display_name)}</div>
          <div class="ac-coords">${Number(d.lat).toFixed(4)}°, ${Number(d.lon).toFixed(4)}°${d.address?.country_code ? ' · ' + d.address.country_code.toUpperCase() : ''}</div>
        </div>`).join('');
      list.querySelectorAll('.autocomplete-item').forEach(el => {
        el.addEventListener('click', () => pick(_acResults[Number(el.dataset.idx)]));
      });
    } catch (e) {
      if (e.name !== 'AbortError') {
        list.innerHTML = `<div class="autocomplete-loading">Search failed: ${e.message}</div>`;
      }
    }
  }

  function pick(result) {
    if (!result) return;
    // Build a clean readable place name
    const a = result.address || {};
    const cityName = a.city || a.town || a.village || a.municipality || a.hamlet || a.county;
    const region   = a.state || a.region;
    const country  = a.country;
    const cleaned  = [cityName, region, country].filter(Boolean).join(', ') || result.display_name;
    input.value = cleaned;
    document.getElementById('f-lat').value = Number(result.lat).toFixed(6);
    document.getElementById('f-lon').value = Number(result.lon).toFixed(6);
    const suggestedTz = suggestTimezone(a);
    if (suggestedTz) {
      const select = document.getElementById('f-tz');
      if ([...select.options].some(o => o.value === suggestedTz)) {
        select.value = suggestedTz;
      }
    }
    document.getElementById('place-readout').innerHTML =
      `${Number(result.lat).toFixed(4)}°, ${Number(result.lon).toFixed(4)}° · ${suggestedTz || document.getElementById('f-tz').value} <button type="button" class="coord-toggle" id="coord-toggle">Edit coords / tz ▸</button>`;
    rewireCoordToggle();
    hideList();
  }
}

function rewireCoordToggle() {
  const btn = document.getElementById('coord-toggle');
  const fields = document.getElementById('coord-fields');
  if (!btn || !fields) return;
  btn.addEventListener('click', () => {
    fields.classList.toggle('show');
    btn.textContent = fields.classList.contains('show') ? 'Hide coords / tz ▾' : 'Edit coords / tz ▸';
  });
}

// ── Save & Recompute (birth data form) ──
function wireSaveAndRecompute(client) {
  const btn = document.getElementById('btn-save');
  const status = document.getElementById('form-status');
  if (!btn) return;
  btn.addEventListener('click', async () => {
    const payload = {
      client_id: CLIENT_ID,
      birth_date: document.getElementById('f-date').value.trim(),
      birth_time: document.getElementById('f-time').value.trim(),
      birth_place: document.getElementById('f-place').value.trim(),
      latitude:    Number(document.getElementById('f-lat').value),
      longitude:   Number(document.getElementById('f-lon').value),
      timezone:    document.getElementById('f-tz').value.trim()
    };
    // Basic validation
    const missing = ['birth_date','birth_time','birth_place','timezone'].filter(k => !payload[k]);
    if (missing.length) { status.textContent = 'missing: ' + missing.join(', '); return; }
    if (Number.isNaN(payload.latitude) || Number.isNaN(payload.longitude)) {
      status.textContent = 'latitude and longitude must be numeric'; return;
    }
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = 'Computing…';
    status.textContent = '';
    try {
      const token = await getFreshAccessToken();
      if (!token) throw new Error('Not authenticated. Please log in via the portal.');
      // Ensure birth_time is HH:MM:SS for the function (HTML <input type=time> may give HH:MM)
      if (/^\d{2}:\d{2}$/.test(payload.birth_time)) payload.birth_time += ':00';
      const res = await fetch(`${SUPABASE_URL}/functions/v1/compute-chart`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_KEY,
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(payload)
      });
      if (!res.ok) {
        const err = await res.text();
        throw new Error(`compute-chart ${res.status}: ${err}`);
      }
      btn.textContent = 'Saved · refreshing…';
      setTimeout(() => location.reload(), 600);
    } catch (e) {
      btn.disabled = false;
      btn.textContent = orig;
      status.textContent = 'failed: ' + e.message;
    }
  });
}

init();
</script>
